<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Greenville Disc Golf Club</title>
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Club">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, rgba(244,244,249,0.25), rgba(244,244,249,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover; opacity: 1;
        }
        [data-theme="dark"] body::before {
            background: linear-gradient(to bottom, rgba(15,15,30,0.25), rgba(15,15,30,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover;
        }

        /* ---- Header / nav (mirrors index.html) ---- */
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); padding: 1rem 1.5rem; transition: all 0.3s ease; }
        [data-theme="dark"] header { background: rgba(15, 15, 30, 0.95); }
        header.scrolled { box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2); padding: 0.75rem 1.5rem; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: white; letter-spacing: 0.05em; text-decoration: none; transition: transform 0.3s ease; display: flex; align-items: center; }
        .logo-image { height: 50px; width: auto; transition: transform 0.3s ease; }
        header.scrolled .logo-image { height: 40px; }
        .logo:active { transform: scale(0.95); }
        .logo:hover .logo-image { transform: scale(1.05); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .theme-toggle { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); color: white; width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; backdrop-filter: blur(5px); -webkit-tap-highlight-color: transparent; }
        .theme-toggle svg, .menu-toggle svg { display: block; pointer-events: none; }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.2); transform: rotate(20deg) scale(1.1); }
        .theme-toggle:active { transform: rotate(20deg) scale(0.95); }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; position: relative; transition: color 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-links a:hover::after, .nav-links a:active::after { width: 100%; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a[aria-current="page"] { text-decoration: underline; text-underline-offset: 5px; font-weight: 800; }
        .nav-links a.nav-donate { background: var(--accent); color: var(--secondary) !important; padding: 0.35rem 0.95rem; border-radius: 999px; font-weight: 800; }
        .nav-links a.nav-donate:hover { color: var(--secondary); filter: brightness(1.08); }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; min-width: 44px; min-height: 44px; -webkit-tap-highlight-color: transparent; transition: transform 0.2s ease; }
        .menu-toggle:active { transform: scale(0.9); }
        body[data-page="events"] #crotts-fab { left: auto !important; right: 18px !important; }
        body[data-page="events"] #crotts-panel { left: auto !important; right: 18px !important; }
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .logo-image { height: 40px; }
            header.scrolled .logo-image { height: 35px; }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .nav-right { gap: 1rem; }
            body[data-page="events"] #crotts-fab { left: auto !important; right: calc(14px + env(safe-area-inset-right, 0px)) !important; }
            body[data-page="events"] #crotts-panel { left: auto !important; right: 12px !important; }
            .nav-links { position: fixed; top: 70px; left: 0; right: 0; background: rgba(26, 26, 46, 0.98); flex-direction: column; gap: 0; padding: 2rem; transform: translateY(-100%); opacity: 0; transition: all 0.3s ease; pointer-events: none; max-height: calc(100vh - 70px); overflow-y: auto; }
            [data-theme="dark"] .nav-links { background: rgba(15, 15, 30, 0.98); }
            .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links li { padding: 1.25rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .nav-links li:last-child { border-bottom: none; }
            .nav-links a { font-size: 1.1rem; display: block; padding: 0.5rem 0; }
        }

        /* ---- Page body ---- */
        main { flex: 1; width: 100%; padding-top: 110px; max-width: 1200px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; padding-bottom: 4rem; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 7vw, 4rem); text-align: center; letter-spacing: 0.05em; color: var(--text-primary); margin: 1rem 0 0.25rem; }
        .page-subtitle { text-align: center; color: rgba(255, 255, 255, 0.94); font-size: 1rem; margin-bottom: 2rem; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }

        /* ---- Event sections ---- */
        .events-section { margin-bottom: 2.75rem; }
        .events-section-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--border-color); }
        .events-section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: 0.04em; color: var(--text-primary); }
        .events-group-head { margin: 2.25rem 0 0.85rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--border-color); }
        .events-group-head .events-section-title { font-size: clamp(1.9rem, 5vw, 2.6rem); }
        .events-group-sub { margin: 0.15rem 0 0; color: var(--text-muted); font-size: 0.95rem; }
        .events-empty { color: var(--text-muted); padding: 0.4rem 0 1rem; }
        .events-section.live .events-section-title { color: var(--primary); }
        .events-section-count { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        .previous-results-panel { margin: 0 0 2rem; }
        .previous-results-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 14px; padding: 1rem 1.15rem; box-shadow: 0 4px 18px var(--card-shadow); cursor: pointer; text-align: left; font: inherit; transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
        .previous-results-toggle:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 24px var(--card-shadow-hover); }
        .previous-results-toggle:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .previous-results-title { display: flex; flex-direction: column; gap: 0.15rem; }
        .previous-results-title strong { font-family: 'Bebas Neue', sans-serif; font-size: 1.45rem; letter-spacing: 0.04em; font-weight: 400; }
        .previous-results-title span { color: var(--text-muted); font-size: 0.9rem; line-height: 1.45; }
        .previous-results-indicator { color: var(--primary); display: inline-flex; align-items: center; line-height: 1; }
        .previous-results-body { margin-top: 1rem; }
        .previous-results-actions { display: flex; align-items: center; justify-content: center; gap: 0.75rem; flex-wrap: wrap; margin: 1.25rem 0 0; }
        .previous-results-status { flex-basis: 100%; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
        .previous-results-btn { background: var(--secondary); color: white; border: none; padding: 0.65rem 1.7rem; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: background 0.15s ease; }
        .previous-results-btn:hover { background: #003d6d; }
        .previous-results-btn.secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .live-dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--primary); display: inline-block; box-shadow: 0 0 0 0 rgba(255,107,53,0.6); animation: pulse 1.8s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,53,0.6); } 70% { box-shadow: 0 0 0 10px rgba(255,107,53,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); } }

        .events-grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        @media (max-width: 560px) { .events-grid { grid-template-columns: 1fr; } }

        .event-card { background: var(--bg-secondary); border-radius: 15px; overflow: hidden; border: 2px solid var(--border-color); transition: all 0.3s ease; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: flex; flex-direction: column; padding: 1.4rem; gap: 0.7rem; box-shadow: 0 6px 24px var(--card-shadow); }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px var(--card-shadow-hover); border-color: var(--primary); }
        .event-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .event-card.live { border-color: var(--primary); box-shadow: 0 8px 30px rgba(255, 107, 53, 0.25); }
        .event-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
        .event-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.45rem; line-height: 1.1; color: var(--text-primary); letter-spacing: 0.02em; }
        .event-meta { font-size: 0.9rem; color: var(--text-tertiary); display: flex; flex-direction: column; gap: 0.3rem; }
        .event-meta .meta-row { display: flex; align-items: center; gap: 0.4rem; }
        .event-meta .meta-icon { display: inline-flex; align-items: center; justify-content: center; width: 1rem; min-width: 1rem; opacity: 0.8; }
        /* External "register" CTA on schedule-feed (linked) cards */
        .event-cta { margin-top: auto; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--primary); }
        .event-cta-icon { display: inline-flex; margin-left: 0.35rem; vertical-align: -0.125em; }
        /* In-house sign-up cards (members or guests) */
        .register-card { cursor: default; }
        .register-card .register-fee { font-size: 0.9rem; color: var(--text-secondary); }
        .register-card .register-status { display: flex; align-items: center; gap: 0.4rem; font-weight: 700; color: var(--green, #2e7d32); }
        .register-form { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.2rem; }
        .reg-input { padding: 0.55rem 0.65rem; border: 1px solid var(--border-color); border-radius: 8px; font: inherit; font-size: 0.9rem; background: var(--bg-primary); color: var(--text-primary); }
        .register-addon { display: flex; align-items: center; gap: 0.45rem; font-size: 0.88rem; color: var(--text-secondary); cursor: pointer; }
        .register-error { color: var(--over); font-size: 0.88rem; line-height: 1.4; font-weight: 700; }
        .register-confirm { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; }
        .reg-btn { margin-top: 0.35rem; background: var(--primary-strong); color: #fff; border: none; padding: 0.6rem 1.4rem; min-height: 42px; border-radius: 50px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; align-self: flex-start; transition: filter 0.2s ease; }
        .reg-btn:hover { filter: brightness(1.07); }
        .reg-btn:disabled { opacity: 0.6; cursor: default; }
        .reg-btn.secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .reg-btn.tertiary { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        #registerSection { background: rgba(244, 244, 249, 0.94); margin: 0 -1.5rem 2rem; padding: 1.25rem 1.5rem 1.5rem; border-radius: 16px; }
        #registerSection:empty { display: none; }
        [data-theme="dark"] #registerSection { background: rgba(15, 15, 30, 0.86); }
        #registerSection .events-group-head { margin-top: 0; }
        /* Keep-score CTA on a live event */
        .btn-keep-score { display: inline-block; margin: 0.25rem 0 0.75rem; background: var(--primary-strong); color: #fff; text-decoration: none; font-weight: 800; padding: 0.7rem 1.3rem; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.9rem; }
        .btn-keep-score:hover { filter: brightness(1.07); }
        /* ---- Badges ---- */
        .badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
        .type-badge { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        [data-theme="dark"] .type-badge { background: var(--bg-primary); }
        .type-badge.tournament { background: linear-gradient(135deg, var(--primary), #cc4a1a); color: white; border: none; }
        .type-badge.league_round { background: linear-gradient(135deg, var(--secondary), var(--green)); color: white; border: none; }
        .type-badge.fundraiser { background: linear-gradient(135deg, var(--accent), #e5a600); color: var(--dark); border: none; }
        .type-badge.meeting { background: var(--bg-tertiary); color: var(--text-secondary); }
        .status-badge { font-size: 0.68rem; }
        .status-badge.live { background: var(--primary-strong); color: white; }
        .status-badge.scheduled { background: rgba(0, 78, 137, 0.15); color: var(--secondary-text); }
        [data-theme="dark"] .status-badge.scheduled { background: rgba(47, 127, 196, 0.25); color: #7fb3e0; }
        .status-badge.final { background: var(--bg-tertiary); color: var(--text-muted); border: 1px solid var(--border-color); }
        .status-badge.cancelled { background: rgba(200, 16, 46, 0.15); color: #c8102e; text-decoration: line-through; }
        [data-theme="dark"] .status-badge.cancelled { color: #e63950; }

        /* ---- Detail view ---- */
        .detail-card { background: var(--bg-secondary); border-radius: 18px; padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: 0 10px 40px var(--card-shadow); border: 1px solid rgba(0, 78, 137, 0.08); margin-bottom: 1.5rem; }
        [data-theme="dark"] .detail-card { border-color: rgba(255, 255, 255, 0.05); }
        .detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
        .detail-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: 0.03em; color: var(--text-primary); flex: 1 1 100%; }
        .detail-facts { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 1.5rem 0; }
        .detail-fact { background: var(--bg-tertiary); border-radius: 12px; padding: 1rem; }
        [data-theme="dark"] .detail-fact { background: var(--bg-primary); }
        .detail-fact .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
        .detail-fact .value { font-size: 1rem; color: var(--text-secondary); font-weight: 600; word-break: break-word; }
        .detail-fact .value a { color: var(--primary); text-decoration: none; }
        .detail-fact .value a:hover { text-decoration: underline; }
        .detail-notes { background: var(--bg-tertiary); border-left: 4px solid var(--accent); border-radius: 8px; padding: 1rem 1.25rem; margin: 1.25rem 0; color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap; }
        [data-theme="dark"] .detail-notes { background: var(--bg-primary); }
        .live-banner { display: flex; align-items: center; gap: 0.6rem; background: linear-gradient(135deg, var(--primary), #cc4a1a); color: white; border-radius: 12px; padding: 1rem 1.25rem; margin: 1.25rem 0; font-weight: 700; }
        .live-banner .leaderboard-link { margin-left: auto; color: white; text-decoration: underline; font-size: 0.9rem; font-weight: 600; }
        .lb-conn { margin-left: auto; font-size: 0.78rem; font-weight: 700; opacity: 0.9; }
        .live-weather { margin: -0.3rem 0 0.85rem; }
        .weather-strip { background: var(--bg-secondary); border: 1px solid var(--border-color); border-left: 4px solid var(--secondary); border-radius: 14px; padding: 0.85rem; }
        .weather-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.65rem; }
        .weather-title { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
        .weather-updated { flex: 0 0 auto; color: var(--text-muted); font-size: 0.68rem; font-weight: 700; }
        .weather-main { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0.75rem; }
        .weather-condition { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
        .weather-temp { flex: 0 0 auto; font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; line-height: 0.9; letter-spacing: 0.04em; color: var(--primary); }
        .weather-copy { display: grid; gap: 0.12rem; min-width: 0; color: var(--text-secondary); }
        .weather-copy strong { color: var(--text-primary); font-size: 0.98rem; line-height: 1.15; }
        .weather-copy span { color: var(--text-muted); font-size: 0.78rem; line-height: 1.2; }
        .weather-graphic { width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-tertiary); line-height: 1; }
        .weather-graphic-icon { font-size: 2rem; line-height: 1; }
        .weather-wind { display: flex; align-items: center; gap: 0.55rem; min-height: 48px; padding: 0.45rem 0.65rem; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-tertiary); color: var(--text-primary); font: inherit; cursor: pointer; }
        .weather-wind:active { transform: scale(0.98); }
        .weather-wind svg { width: 20px; height: 20px; flex: 0 0 20px; color: var(--secondary); }
        .weather-wind[data-relative="facing"] svg { color: var(--primary); }
        .weather-wind-copy { display: grid; gap: 0.05rem; text-align: left; }
        .weather-wind-copy strong { font-size: 0.86rem; line-height: 1.1; white-space: nowrap; }
        .weather-wind-copy span { color: var(--text-muted); font-size: 0.68rem; line-height: 1.15; white-space: nowrap; }
        .weather-wind-mode { text-transform: uppercase; letter-spacing: 0.04em; }
        .weather-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.7rem; }
        .weather-meta span { border: 1px solid var(--border-color); border-radius: 999px; background: var(--bg-tertiary); color: var(--text-secondary); padding: 0.2rem 0.5rem; font-size: 0.72rem; line-height: 1.2; }
        .weather-empty { color: var(--text-secondary); font-size: 0.86rem; }
        .weather-note { margin-top: 0.55rem; color: var(--text-muted); font-size: 0.72rem; line-height: 1.35; }
        @media (max-width: 420px) {
            .weather-head { align-items: flex-start; }
            .weather-main { grid-template-columns: minmax(0, 1fr) auto; }
            .weather-graphic { width: 48px; height: 48px; }
            .weather-graphic-icon { font-size: 1.85rem; }
            .weather-wind { grid-column: 1 / -1; justify-content: flex-start; width: 100%; }
        }
        .lb-wrap { margin: 0.25rem 0 1.25rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .lb-table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 0.95rem; }
        @media (min-width: 620px) { .lb-table { min-width: 0; } }
        .lb-table th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 0.4rem 0.6rem; border-bottom: 2px solid var(--border-color); }
        .lb-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); }
        .lb-table tbody tr:first-child td { font-weight: 700; color: var(--text-primary); }
        .lb-pos { width: 2.5rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .lb-name { font-weight: 600; color: var(--text-primary); }
        .lb-topar { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
        .lb-topar.under { color: #2e9e44; }
        .lb-topar.over { color: var(--primary); }
        .lb-empty { color: var(--text-muted); padding: 0.75rem 0; font-style: italic; }
        .res-chips { font-size: 0.8rem; color: var(--text-muted); }
        .extras-list { margin: 0.25rem 0 1rem 1.25rem; color: var(--text-secondary); line-height: 1.7; }
        #leaguesSection { margin-bottom: 1.5rem; }
        .leagues-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 0.75rem; }
        .league-card { text-align: left; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.25rem; transition: border-color .15s, transform .15s; font: inherit; }
        .league-card:hover { border-color: var(--secondary); transform: translateY(-2px); }
        .league-name { font-weight: 700; color: var(--text-primary); }

<body data-api-base="" data-page="events">

    <main>
        <h1 class="page-title">Events &amp; Club Events</h1>
        <p class="page-subtitle">Disc golf tournaments &amp; league rounds, plus club fundraisers, meetings &amp; minutes</p>

        <!-- Loading / error -->
        <div id="status" class="status-box">
            <div class="spinner"></div>
            <div>Loading&hellip;</div>
        </div>

        <!-- LIVE NOW: any club-scored event currently being scored — always surfaced at the very top -->
        <div id="liveNowSection" hidden></div>

        <!-- REGISTER: club events open for sign-up (members or guests) -->

        <!-- EVENTS: disc golf tournaments & league rounds (schedule feed + any club-scored upcoming events) -->

        <div id="hub" hidden></div>
        <div id="previousResultsSection" hidden></div>
        <div id="leaguesSection" hidden></div>

        <!-- CLUB EVENTS: fundraisers, meetings & minutes -->

        <div id="fundraisersSection" hidden></div>

        <!-- Detail view (single event) -->
        <div id="detail" hidden></div>

        <p id="lastUpdated" class="last-updated" hidden></p>
        <div style="text-align:center;">
            <a href="index.html" class="back-link">&larr; Back to home</a>
        </div>
    </main>

    <footer><p>&copy; 2026 Greenville Disc Golf Club. All rights reserved. | Greenville, NC</p></footer>

    <script type="module">
        import {
            bucketEvents,
            normalizeEvent,
            parseEventDate,
            groupPlayersByDivision,
            buildCourseIndex,
            courseNameFor,
            formatEventDate,
            formatClubDateTime,
            typeLabel,
            statusLabel,
        } from './events.js';
        import { teeSignNode } from './tee-sign.js';
        import { holeWinners, playersFromResults, winnerColor } from './matchplay-colors.js';
        import { parseHomepageEventDate } from './home-feed-parse.js';

        // --- API wiring ---
        // Public read endpoints on the club Worker. Base is configurable on <body>
        // so the senior engineer can repoint it at a local Worker for testing.
        const LOCAL_API_BASE = ['127.0.0.1', 'localhost'].includes(location.hostname)
            ? 'http://127.0.0.1:8788'
            : '';
        // Explicit data-api-base wins; else resolve by host (prod vs the gvdgclub.com dev site / previews).
        const _h = location.hostname;
        const API_BASE = (
            LOCAL_API_BASE ||
            (document.body.dataset.apiBase || '').trim() ||
            ((_h === 'greenvillediscgolf.com' || _h === 'www.greenvillediscgolf.com')
                ? 'https://auth.greenvillediscgolf.com' : 'https://auth.gvdgclub.com')
        )
            .trim()
            .replace(/\/+$/, ''); // strip trailing slashes
        const REFRESH_MS = 60 * 1000; // ~60s background refresh on the hub
        const EVENTS_PAGE_SIZE = 2000;
        const EVENTS_PAGE_MAX_LIMIT = 2000;
        const RYDER_CUP_LEAGUE_ID = '4';
        const eventsLoadState = {
            events: [],
            loading: false,
        };

        const statusEl = document.getElementById('status');
        const liveNowEl = document.getElementById('liveNowSection');
        const registerEl = document.getElementById('registerSection');
        const calendarEl = document.getElementById('calendarEvents');
        const hubEl = document.getElementById('hub');
        const previousResultsEl = document.getElementById('previousResultsSection');
        const leaguesEl = document.getElementById('leaguesSection');
        const clubEl = document.getElementById('clubEventsSection');
        const fundraisersEl = document.getElementById('fundraisersSection');
        const meetingsEl = document.getElementById('meetingsSection');
        const detailEl = document.getElementById('detail');
        const lastUpdatedEl = document.getElementById('lastUpdated');

        // In-memory caches so navigating hub <-> detail doesn't refetch needlessly.
        let courseIndex = new Map();
        let coursesCache = [];
        let coursesLoaded = false;
        let refreshTimer = null;

        // --- XSS-safe DOM helper (mirrors ryder-cup.html) ---
        // Every piece of API data lands here as a text node; we NEVER assign
        // innerHTML with API data anywhere in this file.
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        // Build a safe external anchor. href is sanitized to http(s) only so a
        // hostile external_url/udisc_url can't inject a javascript: URL.
        function safeLink(href, text) {
            const a = el('a', null, text);
            const clean = sanitizeUrl(href);
            if (clean) {
                a.href = clean;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
            }
            return a;
        }
        function sanitizeUrl(raw) {
            if (!raw) return '';
            try {
                const u = new URL(String(raw), window.location.href);
                return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
            } catch (_e) {
                return '';
            }
        }
        function isRyderCupName(value) {
            return /\bryder\s*cup\b/i.test(String(value || ''));
        }
        function leagueHash(id) {
            return `#league/${encodeURIComponent(String(id))}`;
        }
        function ryderCupLeagueHash() {
            return leagueHash(RYDER_CUP_LEAGUE_ID);
        }
        function ryderCupFeedHash(item) {
            return isRyderCupName(item && item.name) ? ryderCupLeagueHash() : '';
        }
        function ryderCupEventHash(ev) {
            if (!ev) return '';
            const leagueId = ev.league_id != null ? String(ev.league_id) : '';
            if (leagueId && leagueId === RYDER_CUP_LEAGUE_ID) return leagueHash(leagueId);
            return isRyderCupName(ev.name) ? ryderCupLeagueHash() : '';
        }

        function setView(which) {
            statusEl.hidden = which !== 'status';
            liveNowEl.hidden = which !== 'hub';
            registerEl.hidden = which !== 'hub';
            calendarEl.hidden = which !== 'hub';
            hubEl.hidden = which !== 'hub';
            previousResultsEl.hidden = which !== 'hub';
            leaguesEl.hidden = which !== 'hub';
            clubEl.hidden = which !== 'hub';
            fundraisersEl.hidden = which !== 'hub';
            meetingsEl.hidden = which !== 'hub';
            detailEl.hidden = which !== 'detail';
        }

        // A group heading (e.g. "Events", "Club Events") with a one-line description.
        function groupHeading(title, sub) {
            const wrap = el('div', 'events-group-head');
            wrap.appendChild(el('h2', 'events-section-title', title));
            if (sub) wrap.appendChild(el('p', 'events-group-sub', sub));
            return wrap;
        }

        // Render a schedule-feed list (Google Sheet items: {name, date, detail, url}) as linked cards.
        function feedList(items) {
            const grid = el('div', 'events-grid');
            for (const it of items) {
                const leagueTarget = ryderCupFeedHash(it);
                const clean = leagueTarget || sanitizeUrl(it.url);
                const card = el(clean ? 'a' : 'div', 'event-card');
                if (leagueTarget) {
                    card.href = leagueTarget;
                } else if (clean) {
                    card.href = clean;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                }
                const top = el('div', 'event-card-top');
                top.appendChild(el('h3', 'event-name', it.name));
                card.appendChild(top);
                const meta = el('div', 'event-meta');
                const dateRow = el('div', 'meta-row');
                dateRow.appendChild(el('span', 'meta-icon', '📅'));
                dateRow.appendChild(el('span', null, it.date || 'TBD'));
                meta.appendChild(dateRow);
                if (it.detail) {
                    const dRow = el('div', 'meta-row');
                    dRow.appendChild(el('span', 'meta-icon', '📍'));
                    dRow.appendChild(el('span', null, it.detail));
                    meta.appendChild(dRow);
                }
                card.appendChild(meta);
                // When the schedule row carries a link (Disc Golf Scene / PDGA), make registering explicit.
                if (leagueTarget) card.appendChild(el('div', 'event-cta', 'League / Results'));
                else if (clean) card.appendChild(el('div', 'event-cta', 'Register / Details ↗'));
                grid.appendChild(card);
            }
            return grid;
        }

        function startOfToday() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return today;
        }

        function feedDateInfo(item) {
            const epoch = Number(item && item.epoch);
            if (Number.isFinite(epoch) && epoch > 0) {
                const ms = epoch < 100000000000 ? epoch * 1000 : epoch;
                const fromEpoch = new Date(ms);
                if (!Number.isNaN(fromEpoch.getTime())) {
                    return { dateObj: fromEpoch, isPast: fromEpoch < startOfToday(), isTBD: false };
                }
            }
            return parseHomepageEventDate(String((item && item.date) || ''));
        }

        function isPastFeedItem(item) {
            const info = feedDateInfo(item);
            return !info.isTBD && info.isPast;
        }

        function eventDateForSort(ev) {
            return parseEventDate((ev && (ev.date || ev.starts_at)) || null);
        }

        function isArchivedClubEvent(raw) {
            const ev = normalizeEvent(raw);
            if (ev.status === 'live') return false;
            if (ev.status === 'final' || ev.status === 'cancelled') return true;
            const d = eventDateForSort(ev);
            return d ? d < startOfToday() : false;
        }

        function splitFeedByDate(items) {
            const active = [];
            const archived = [];
            for (const item of items || []) {
                (isPastFeedItem(item) ? archived : active).push(item);
            }
            const byDate = (a, b) => feedDateInfo(a).dateObj - feedDateInfo(b).dateObj;
            active.sort(byDate);
            archived.sort((a, b) => feedDateInfo(b).dateObj - feedDateInfo(a).dateObj);
            return { active, archived };
        }

        function splitClubEventsByDate(items) {
            const active = [];
            const archived = [];
            for (const raw of items || []) {
                const ev = normalizeEvent(raw);
                (isArchivedClubEvent(ev) ? archived : active).push(ev);
            }
            return { active, archived };
        }

        function feedResultDateText(item) {
            if (item && item.date) return String(item.date);
            const info = feedDateInfo(item);
            if (!info.isTBD && info.dateObj && !Number.isNaN(info.dateObj.getTime())) {
                return info.dateObj.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            }
            return 'Date TBD';
        }

        function previousResultFromFeed(item, category) {
            const info = feedDateInfo(item);
            const leagueTarget = ryderCupFeedHash(item);
            const externalHref = leagueTarget ? '' : sanitizeUrl(item && item.url);
            return {
                name: String((item && item.name) || 'Previous result'),
                dateObj: info.dateObj,
                dateText: feedResultDateText(item),
                detail: String((item && item.detail) || ''),
                label: category,
                href: leagueTarget || externalHref,
                external: !!externalHref,
                cta: leagueTarget ? 'League / Results' : (externalHref ? 'Results / Details' : ''),
            };
        }

        function previousResultFromEvent(raw) {
            const ev = normalizeEvent(raw);
            const leagueTarget = ryderCupEventHash(ev);
            const courseName = courseNameFor(courseIndex, ev.course_id);
            return {
                name: ev.name,
                dateObj: eventDateForSort(ev),
                dateText: formatEventDate(ev.date || ev.starts_at),
                detail: [courseName, statusLabel(ev.status)].filter(Boolean).join(' · '),
                label: typeLabel(ev.type),
                typeClass: ev.type,
                status: ev.status,
                statusLabel: statusLabel(ev.status),
                href: leagueTarget || `#event/${encodeURIComponent(ev.id)}`,
                external: false,
                cta: leagueTarget ? 'League / Results' : 'View results',
            };
        }

        function previousResultTime(item) {
            return item && item.dateObj && !Number.isNaN(item.dateObj.getTime()) ? item.dateObj.getTime() : 0;
        }

        function publishPreviousResults(results) {
            const safeResults = Array.isArray(results) ? results : [];
            window.__gvdgEventsPreviousResults = safeResults;
            window.dispatchEvent(new CustomEvent('gvdg:events-previous-results', {
                detail: { results: safeResults },
            }));
        }

        function showStatus(message, isError, onRetry) {
            setView('status');
            statusEl.className = 'status-box' + (isError ? ' error' : '');
            statusEl.replaceChildren();
            if (isError) {
                statusEl.appendChild(el('div', null, message));
                const btn = el('button', 'retry-btn', 'Retry');
                btn.type = 'button';
                btn.addEventListener('click', onRetry || route);
                statusEl.appendChild(btn);
            } else {
                statusEl.appendChild(el('div', 'spinner'));
                statusEl.appendChild(el('div', null, message));
            }
        }

        function showEmpty(message) {
            setView('status');
            statusEl.className = 'status-box';
            statusEl.replaceChildren();
            statusEl.appendChild(el('div', 'empty-icon', '🥏'));
            statusEl.appendChild(el('div', null, message));
        }

        async function fetchJson(path) {
            const res = await fetch(`${API_BASE}${path}`, {
                cache: 'no-store',
                headers: { Accept: 'application/json' },
            });
            if (!res.ok) throw new Error(`Request failed (${res.status})`);
            return res.json();
        }

        // Lazily load /courses once so cards/detail can show a course name.
        async function ensureCourses() {
            if (coursesLoaded) return;
            try {
                const data = await fetchJson('/courses');
                coursesCache = Array.isArray(data && data.courses) ? data.courses : [];
                courseIndex = buildCourseIndex(coursesCache);
            } catch (_e) {
                // Course names are a nicety — never block events on this.
                coursesCache = [];
                courseIndex = new Map();
            }
            coursesLoaded = true;
        }

        // ---------- HUB ----------
        function badge(text, classes) {
            const b = el('span', 'badge ' + classes, text);
            return b;
        }

        function eventCard(ev) {
            // Use a <button> so the card is keyboard-focusable + screen-reader friendly.
            const card = el('button', 'event-card' + (ev.status === 'live' ? ' live' : ''));
            card.type = 'button';
            const leagueTarget = ryderCupEventHash(ev);
            card.addEventListener('click', () => {
                window.location.hash = leagueTarget || `#event/${encodeURIComponent(ev.id)}`;
            });

            const top = el('div', 'event-card-top');
            top.appendChild(el('h3', 'event-name', ev.name));
            if (ev.type) top.appendChild(badge(typeLabel(ev.type), 'type-badge ' + ev.type));
            card.appendChild(top);

            const meta = el('div', 'event-meta');
            const dateRow = el('div', 'meta-row');
            dateRow.appendChild(el('span', 'meta-icon', '📅'));
            dateRow.appendChild(el('span', null, formatEventDate(ev.date)));
            meta.appendChild(dateRow);

            const courseName = courseNameFor(courseIndex, ev.course_id);
            if (courseName) {
                const courseRow = el('div', 'meta-row');
                courseRow.appendChild(el('span', 'meta-icon', '📍'));
                courseRow.appendChild(el('span', null, courseName));
                meta.appendChild(courseRow);
            }
            card.appendChild(meta);

            if (ev.status) {
                const statusRow = el('div', 'event-card-top');
                statusRow.appendChild(badge(statusLabel(ev.status), 'status-badge ' + ev.status));
                card.appendChild(statusRow);
            }
            return card;
        }

        function section(title, events, opts = {}) {
            const wrap = el('section', 'events-section' + (opts.live ? ' live' : ''));
            const head = el('div', 'events-section-head');
            if (opts.live) head.appendChild(el('span', 'live-dot'));
            head.appendChild(el('h2', 'events-section-title', title));
            head.appendChild(el('span', 'events-section-count', `${events.length} event${events.length === 1 ? '' : 's'}`));
            wrap.appendChild(head);

            const grid = el('div', 'events-grid');
            for (const ev of events) grid.appendChild(eventCard(ev));
            wrap.appendChild(grid);
            return wrap;
        }
        // Render the two club categories: Events (schedule feed + any club-scored D1 events) and the
        // Club Events heading (fundraisers/meetings render into their own sections just below).
        function renderPage(feed, d1events) {
            const { active: feedEvents, archived: feedArchived } = splitFeedByDate((feed && feed.events) || []);
            const { active: feedClub, archived: feedClubArchived } = splitFeedByDate((feed && feed.clubEvents) || []);
            const { active: activeD1, archived: d1Archived } = splitClubEventsByDate(d1events || []);
            const { live, upcoming } = bucketEvents(activeD1);
            const previousResults = [
                ...d1Archived.map(previousResultFromEvent),
                ...feedArchived.map((item) => previousResultFromFeed(item, 'Event')),
                ...feedClubArchived.map((item) => previousResultFromFeed(item, 'Club Event')),
            ].sort((a, b) => previousResultTime(b) - previousResultTime(a));

            // LIVE NOW — pinned to the very top so an in-progress event is impossible to miss.
            liveNowEl.replaceChildren();
            if (live.length) liveNowEl.appendChild(section('Live Now', live, { live: true }));

            calendarEl.replaceChildren();
            calendarEl.appendChild(groupHeading('Events', 'Disc golf tournaments & league rounds'));
            if (feedEvents.length) calendarEl.appendChild(feedList(feedEvents));

            hubEl.replaceChildren();
            if (upcoming.length) hubEl.appendChild(section('Upcoming', upcoming));
            // Empty-state reflects the MAIN flow only (live/upcoming/feed). Previous results live in a
            // collapsed section below the current and upcoming events,
            // so their presence must not suppress the "nothing scheduled" message.
            if (!feedEvents.length && !live.length && !upcoming.length) {

        // ---- Live leaderboard (S3): WebSocket viewer with polling fallback ----
        let activeLive = null;
        function teardownLive() {
            if (!activeLive) return;
            try { if (activeLive.ws) activeLive.ws.close(); } catch (_e) {}
            if (activeLive.poll) clearInterval(activeLive.poll);
            activeLive = null;
        }
        function fmtToPar(n) { n = n || 0; return n === 0 ? 'E' : (n > 0 ? '+' + n : String(n)); }
        // Matchplay display helpers — a matchplay round reports its result as a match status ("won 3&2",
        // "2 up", "AS"), never a stroke score. matchText reads a live standing's .match; parseMatchResult
        // reads a finalized result row's match_result JSON (null → the row is stroke play).
        // The match status ("won 3&2") is match-level and shared by both sides; label the losing side "lost 3&2".
        function matchLabel(m) { if (!m || !m.status) return 'AS'; return (m.outcome === 'lost' || m.outcome === 'trailing') ? m.status.replace(/^won /, 'lost ') : m.status; }
        function matchText(m) { if (!m || !m.status) return 'AS'; return (m.dormie ? '⚑ ' : '') + matchLabel(m); }
        function parseMatchResult(raw) { if (!raw) return null; try { const m = JSON.parse(raw); return m && m.status ? m : null; } catch (_e) { return null; } }
        function standingNameCell(s, dbl) {
            const td = el('td', 'lb-name', s && s.name != null ? String(s.name) : 'Player');
            if (dbl && s && Array.isArray(s.members) && s.members.length) td.appendChild(el('span', 'lb-members', ' (' + s.members.join(' & ') + ')'));
            return td;
        }
        function renderStandings(container, snap) {
            const standings = (snap && snap.standings) || [];
            container.replaceChildren();
            if (!standings.length) { container.appendChild(el('p', 'lb-empty', 'Waiting for the first scores…')); return; }
            const cfg = (snap && snap.roundConfig) || {};
            const mp = cfg.scoringStyle === 'matchplay';
            const dbl = cfg.groupFormat === 'doubles';
            const hasDiv = !mp && standings.some((s) => s && s.division);
            const table = el('table', 'lb-table');
            const thead = el('thead'); const htr = el('tr');
            const cols = mp
                ? ['Pos', dbl ? 'Team' : 'Player', 'Thru', 'Match']
                : (hasDiv ? ['Pos', 'Player', 'Div', 'Thru', 'Total', 'To Par'] : ['Pos', 'Player', 'Thru', 'Total', 'To Par']);
            cols.forEach((h) => htr.appendChild(el('th', null, h)));
            thead.appendChild(htr); table.appendChild(thead);
            const tbody = el('tbody');
            standings.forEach((s, i) => {
                const tr = el('tr');
                tr.appendChild(el('td', 'lb-pos', String(i + 1)));
                tr.appendChild(standingNameCell(s, dbl));
                if (mp) {
                    tr.appendChild(el('td', null, s && s.thru ? String(s.thru) : '—'));
                    tr.appendChild(el('td', 'lb-match', matchText(s && s.match)));
                } else {
                    if (hasDiv) tr.appendChild(el('td', null, (s && s.division) || '—'));
                    tr.appendChild(el('td', null, s && s.thru ? String(s.thru) : '—'));
                    tr.appendChild(el('td', null, s && s.total != null && s.thru ? String(s.total) : '—'));
                    const tp = el('td', 'lb-topar', s && s.thru ? fmtToPar(s.toPar) : '—');
                    if (s && s.thru) { if ((s.toPar || 0) < 0) tp.classList.add('under'); else if ((s.toPar || 0) > 0) tp.classList.add('over'); }
                    tr.appendChild(tp);
                }
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

        function renderLiveSnapshot(container, weatherEl, snap) {
            if (window.GVDGWeather && weatherEl) window.GVDGWeather.renderWeather(weatherEl, snap && snap.weather, { title: 'Round weather' });
            renderStandings(container, snap);
        }
        function mountLiveLeaderboard(eventId, container, statusEl, weatherEl) {
            teardownLive();
            const ctx = { ws: null, poll: null, gotWs: false, done: false };
            activeLive = ctx;
            const setConn = (t) => { if (statusEl) statusEl.textContent = t; };
            const render = (snap) => {
                if (activeLive !== ctx) return;
                renderLiveSnapshot(container, weatherEl, snap);
                // Round finalized/cancelled → stop polling; the detail view swaps to final results on next load.
                if (snap && snap.status && snap.status !== 'live') { ctx.done = true; if (ctx.poll) { clearInterval(ctx.poll); ctx.poll = null; } setConn('final'); }
            };
            const pollOnce = async () => { try { const d = await fetchJson(`/events/${encodeURIComponent(eventId)}/live`); render(d); } catch (_e) {} };
            const startPolling = () => { if (ctx.poll || ctx.done || activeLive !== ctx) return; setConn('live (auto-refresh)'); pollOnce(); ctx.poll = setInterval(pollOnce, 5000); };
            try {
                const wsUrl = API_BASE.replace(/^http/, 'ws') + `/events/${encodeURIComponent(eventId)}/live/ws`;
                const ws = new WebSocket(wsUrl);
                ctx.ws = ws;
                ws.onopen = () => { ctx.gotWs = true; setConn('● live'); };
                ws.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (_e) {} };
                // A dropped socket (common on a phone over a full round, or a CF edge recycle) must NOT freeze
                // the board. Fall back to polling on ANY close/error — previously this was gated on !gotWs, so
                // a mid-round drop left the leaderboard stuck on its last frame with no updates.
                ws.onerror = () => { startPolling(); };
                ws.onclose = () => { startPolling(); };
                setTimeout(() => { if (!ctx.gotWs) startPolling(); }, 4000); // fallback if the upgrade stalls
            } catch (_e) { startPolling(); }
        }

        // ---- Final results (R2 / club archive): rendered for finalized events ----
        function fmtBreakdown(raw) {
            let b = {}; try { b = JSON.parse(raw || '{}') || {}; } catch (_e) {}
            const parts = [];
            const add = (n, label) => { if (b[n]) parts.push(b[n] + ' ' + label + (b[n] > 1 ? 's' : '')); };
            add('aces', 'ace'); add('eagles', 'eagle'); add('birdies', 'birdie'); add('pars', 'par'); add('bogeys', 'bogey'); add('doubles_plus', 'dbl+');
            return parts.join(' · ');
        }
        async function renderFinalResults(eventId, container, courseId) {

            if (!results.length) { container.appendChild(el('p', 'lb-empty', 'Results not posted yet.')); return; }
            // A finalized matchplay round records its result in match_result (e.g. "won 3&2"); its stroke
            // to_par is a meaningless artifact, so show the Match column instead of Total/To Par.
            const mp = results.some((r) => parseMatchResult(r.match_result));
            const table = el('table', 'lb-table');
            const thead = el('thead'); const htr = el('tr');
            (mp ? ['Pos', 'Player', 'Match', 'Scoring'] : ['Pos', 'Player', 'Total', 'To Par', 'Scoring']).forEach((h) => htr.appendChild(el('th', null, h)));
            thead.appendChild(htr); table.appendChild(thead);
            const tbody = el('tbody');
            results.forEach((r) => {
                const tr = el('tr');
                tr.appendChild(el('td', 'lb-pos', r.place != null ? String(r.place) : '—'));
                const nameTd = el('td', 'lb-name', r.name != null ? String(r.name) : 'Player');
                let sgLabel = null; try { const sg = JSON.parse(r.scoring_group || 'null'); if (sg && sg.label) sgLabel = String(sg.label); } catch (_e) {}
                if (sgLabel) nameTd.appendChild(el('span', 'lb-members', ' · ' + sgLabel));
                tr.appendChild(nameTd);

                } else {
                    tr.appendChild(el('td', null, r.total != null ? String(r.total) : '—'));

            // "Add to UDisc": one tap per player to open the right UDisc course + their hole-by-hole
            // scores to enter (UDisc has no import API). Needs the course's numeric UDisc id and a
            // stored scorecard; otherwise this section is simply omitted.
            const course = courseIndex.get(String(courseId));

                    if (node) sec.appendChild(node);

        // T4: per-hole tee signs for the event's selected layout. Viewer is public → official photos only;
        // holes without a photo fall back to the SVG tee sign rendered from the confirmed layout data.
        async function renderTeeSigns(ev, card) {
            if (!ev.course_id) return;
            const [ld, td] = await Promise.all([
                fetchJson(`/courses/${encodeURIComponent(ev.course_id)}/layouts`).catch(() => null),
                fetchJson(`/courses/${encodeURIComponent(ev.course_id)}/tee-signs`).catch(() => null),
            ]);
            const layouts = (ld && ld.layouts) || [];
            const signs = (td && td.teeSigns) || [];
            const layout = layouts.find((l) => String(l.id) === ev.layout_id) || layouts[0] || null;
            let holes = [];
            if (layout) { try { holes = JSON.parse(layout.holes || '[]'); } catch (_e) { holes = []; } }
            const officialByHole = new Map();
            signs.forEach((s) => { if (s.status === 'official') officialByHole.set(Number(s.hole_number), s.id); });
            const holeData = new Map(holes.map((h) => [Number(h.hole), h]));
            const holeNums = new Set([...holeData.keys(), ...officialByHole.keys()]);
            if (!holeNums.size) return; // nothing confirmed yet → no section (capture CTA lives on the members page)
            // Matchplay: tint each hole by the team that won it (yellow = halved). Final rounds read the
            // finalized results; a live round reads the snapshot. Non-matchplay / no-scorecard → uncolored.
            const holeList = [...holeNums].map((n) => ({ hole: n })); // color the holes actually shown (photos or SVG), not just layout holes
            let holeWins = {};
            try {
                if (ev.status === 'final') {
                    const rd = await fetchJson(`/events/${encodeURIComponent(ev.id)}/results`).catch(() => null);
                    holeWins = holeWinners(holeList, playersFromResults((rd && rd.results) || []));
                } else {
                    const sd = await fetchJson(`/events/${encodeURIComponent(ev.id)}/live`).catch(() => null);
                    if (sd && sd.roundConfig && sd.roundConfig.scoringStyle === 'matchplay') holeWins = holeWinners((sd.holes && sd.holes.length) ? sd.holes : holeList, sd.players || []);
                }
            } catch (_e) {}
            card.appendChild(el('h3', 'roster-title', '🪧 Tee Signs' + (layout ? ' — ' + layout.name : '')));
            const grid = el('div', 'tee-signs-grid');
            const courseName = courseNameFor(courseIndex, ev.course_id) || '';
            for (const hn of [...holeNums].sort((a, b) => a - b)) {
                const h = holeData.get(hn) || { hole: hn };
                const holeCard = el('div', 'ts-hole-card');
                const wc = winnerColor(holeWins[hn]); // team color for a won hole; yellow for a halve
                if (wc) { holeCard.style.boxShadow = '0 0 0 3px ' + wc; holeCard.style.borderRadius = '10px'; }
                const signId = officialByHole.get(hn);
                if (signId != null) {
                    const img = el('img', 'ts-hole-photo');
                    img.loading = 'lazy';
                    img.alt = `Tee sign, hole ${hn}`;
                    img.src = `${API_BASE}/tee-signs/${encodeURIComponent(signId)}/image`;
                    holeCard.appendChild(img);
                } else {
                    const wrap = el('div', 'ts-hole-svg');
                    const node = teeSignNode({ hole: hn, courseName, layouts: [{ label: layout ? layout.name : 'Layout', color: h.color || (h.tee && h.tee.color) || null, par: h.par != null ? h.par : null, distance_ft: h.distance_ft != null ? h.distance_ft : null }] });
                    if (node) wrap.appendChild(node);
                    holeCard.appendChild(wrap);
                }
                const meta = el('div', 'ts-hole-meta');
                meta.appendChild(el('span', 'ts-hole-num', 'Hole ' + hn));
                const bits = [];
                if (h.par != null) bits.push('Par ' + h.par);
                if (h.distance_ft != null) bits.push(h.distance_ft + ' ft');
                if (bits.length) meta.appendChild(document.createTextNode(' · ' + bits.join(' · ')));
                holeCard.appendChild(meta);
                grid.appendChild(holeCard);
            }
            card.appendChild(grid);
        }

        function renderDetail(rawEvent) {
            const ev = normalizeEvent(rawEvent);
            detailEl.replaceChildren();

            const backBtn = el('button', 'back-link', '← All events');
            backBtn.type = 'button';
            backBtn.addEventListener('click', () => { window.location.hash = ''; });
            detailEl.appendChild(backBtn);

            const card = el('div', 'detail-card');

            const head = el('div', 'detail-head');
            head.appendChild(el('h2', 'detail-title', ev.name));
            if (ev.type) head.appendChild(badge(typeLabel(ev.type), 'type-badge ' + ev.type));
            if (ev.status) head.appendChild(badge(statusLabel(ev.status), 'status-badge ' + ev.status));
            card.appendChild(head);

            // Live scoring: real-time leaderboard over WebSocket (polling fallback).
            if (ev.status === 'live') {
                const banner = el('div', 'live-banner');
                banner.appendChild(el('span', 'live-dot'));
                banner.appendChild(el('span', null, 'Live scoring in progress'));
                const conn = el('span', 'lb-conn', 'connecting…');
                banner.appendChild(conn);
                card.appendChild(banner);
                // Players keep their own card's scores in the mobile scorecard app (score.html). Members use
                // their saved login; a guest registrant passes their registration token so they can score too.
                const ks = el('a', 'btn-keep-score', '✏️ Keep score for my card');
                let href = 'score.html?event=' + encodeURIComponent(ev.id);
                const gr = (typeof guestRegs === 'function' ? guestRegs()[ev.id] : null);
                if (!memberToken() && gr && gr.guestToken) href += '&gt=' + encodeURIComponent(gr.guestToken);
                ks.href = href;
                card.appendChild(ks);
                const weather = el('div', 'live-weather'); weather.hidden = true;
                card.appendChild(weather);
                const lb = el('div', 'lb-wrap');
                card.appendChild(lb);
                mountLiveLeaderboard(ev.id, lb, conn, weather);
            } else if (ev.status === 'final') {
                const rwrap = el('div', 'lb-wrap');
                card.appendChild(rwrap);
                renderFinalResults(ev.id, rwrap, ev.course_id);
            }

            const facts = el('div', 'detail-facts');
            facts.appendChild(fact('Date', formatEventDate(ev.date)));
            // Scheduled start + sign-up/check-in cutoffs, shown in club (Eastern) time when set.
            if (ev.starts_at) facts.appendChild(fact('Starts', formatClubDateTime(ev.starts_at)));
            if (ev.registration_deadline) facts.appendChild(fact('Registration closes', formatClubDateTime(ev.registration_deadline)));
            if (ev.checkin_deadline) facts.appendChild(fact('Check-in closes', formatClubDateTime(ev.checkin_deadline)));
            if (ev.format) facts.appendChild(fact('Format', ev.format));

            const courseName = courseNameFor(courseIndex, ev.course_id);
            const course = courseIndex.get(String(ev.course_id));
            if (courseName) {
                const udiscLink = course && sanitizeUrl(course.udisc_url);
                if (udiscLink) {
                    const wrap = el('span');
                    wrap.appendChild(el('span', null, courseName + ' '));
                    wrap.appendChild(safeLink(course.udisc_url, '(UDisc ↗)'));
                    facts.appendChild(fact('Course', wrap));
                } else {
                    facts.appendChild(fact('Course', courseName));
                }
            }
            if (ev.external_url && sanitizeUrl(ev.external_url)) {
                facts.appendChild(fact('More info', safeLink(ev.external_url, 'External link ↗')));
            }
            card.appendChild(facts);

            if (ev.notes) {
                card.appendChild(el('div', 'detail-notes', ev.notes));
            }

            // Roster, grouped by division when present.
            const grouped = groupPlayersByDivision(ev.players);
            if (grouped.length) {
                card.appendChild(el('h3', 'roster-title', `Players (${ev.players.length})`));
                // If everyone is in the single synthetic 'Open' group, skip the heading.
                const showDivisionHeads = !(grouped.length === 1 && grouped[0].division === 'Open');
                for (const group of grouped) {
                    const groupWrap = el('div', 'division-group');
                    if (showDivisionHeads) groupWrap.appendChild(el('div', 'division-name', group.division));
                    const listEl = el('div', 'player-list');
                    for (const p of group.players) {
                        const row = el('div', 'player-row');
                        row.appendChild(el('span', 'player-name', p && p.name != null ? String(p.name) : 'Unnamed'));
                        if (p && p.pdga_no) row.appendChild(el('span', 'player-pdga', '#' + p.pdga_no));
                        if (p && p.team) row.appendChild(el('span', 'player-team', String(p.team)));
                        listEl.appendChild(row);
                    }
                    groupWrap.appendChild(listEl);
                    card.appendChild(groupWrap);
                }
            }

            renderEventExtras(ev.id, card); // CTPs + ace pot (Track G G3), filled in async
            renderTeeSigns(ev, card);       // T4: per-hole tee signs (official photo / SVG fallback), filled in async

            detailEl.appendChild(card);
            setView('detail');
            lastUpdatedEl.hidden = true;
            window.scrollTo(0, 0);
        }

        async function loadDetail(id) {
            teardownLive(); // close any prior live socket before re-rendering
            showStatus('Loading event…', false);
            try {
                await ensureCourses(); // for course name + UDisc link
                const data = await fetchJson(`/events/${encodeURIComponent(id)}`);
                if (!data || !data.event) {
                    showStatus('That event could not be found.', true, () => { window.location.hash = ''; });
                    return;
                }
                renderDetail(data.event);
            } catch (_err) {
                showStatus('We couldn’t load that event right now. Please try again.', true, () => loadDetail(id));
            }
        }

        // ---------- ROUTING ----------
        // Hash route: "#event/:id" -> event detail; "#league/:id" -> league standings; else hub.
        function parseHash() {
            const h = window.location.hash || '';
            let m = h.match(/^#event\/(.+)$/); if (m) return { view: 'event', id: decodeURIComponent(m[1]) };
            m = h.match(/^#league\/(.+)$/); if (m) return { view: 'league', id: decodeURIComponent(m[1]) };
            m = h.match(/^#manage=(\d+)-([a-f0-9]+)$/i); if (m) return { view: 'manage', id: m[1], token: m[2] };
            return null;
        }

        // A guest's emailed manage link (#manage=<eventId>-<token>): re-seed this browser from the token so
        // the Register section shows their sign-up here (with Withdraw), then drop the token from the URL.
        async function applyManage(eid, token) {
            try {
                const r = await regApi('/events/' + eid + '/registration?gt=' + encodeURIComponent(token));
                if (r.ok) { const d = await r.json(); if (d && d.registration) setGuestReg(eid, { guestToken: token, name: d.registration.name }); }
            } catch (_e) {}
            history.replaceState(null, '', location.pathname + location.search);
            loadHub(); startRefresh();
        }

        function route() {
            stopRefresh();
            const r = parseHash();
            if (r && r.view === 'event') loadDetail(r.id);
            else if (r && r.view === 'league') loadLeague(r.id);
            else if (r && r.view === 'manage') applyManage(r.id, r.token);
            else { loadHub(); startRefresh(); }
        }

        // Quiet ~60s background refresh while on the hub. Keeps current content
        // on screen and only swaps it in once the new payload parses cleanly.
        function startRefresh() {
            stopRefresh();
            refreshTimer = setInterval(() => {
                if (!hubEl.hidden) {
                    loadHub({ reset: true, preserveCount: true, quiet: true });
                }
            }, REFRESH_MS);
        }

        function stopRefresh() {
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        }

        window.addEventListener('hashchange', route);
        route();
    </script>
    <script src="crotts.js" defer></script>
</body>
</html>
