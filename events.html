<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Greenville Disc Golf Club</title>
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Club">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #004E89; --secondary-text: #004E89; /* navy link/accent text → readable light blue in dark mode */
            --accent: #F7B801;
            --dark: #1A1A2E;
            --light: #F4F4F9;
            --green: #2D5016;
            --bg-primary: #F4F4F9;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F4F4F9;
            --text-primary: #1A1A2E;
            --text-secondary: #333333;
            --text-tertiary: #555555;
            --text-muted: #666666;
            --border-color: #F4F4F9;
            --card-shadow: rgba(0, 0, 0, 0.1);
            --card-shadow-hover: rgba(0, 0, 0, 0.15);
        }
        [data-theme="dark"] {
            --bg-primary: #0F0F1E;
            --bg-secondary: #1A1A2E;
            --bg-tertiary: #252538;
            --text-primary: #F4F4F9; --secondary-text: #6cb4e8;
            --text-secondary: #E0E0E0;
            --text-tertiary: #C0C0C0;
            --text-muted: #A0A0A0;
            --border-color: #2A2A3E;
            --card-shadow: rgba(0, 0, 0, 0.3);
            --card-shadow-hover: rgba(0, 0, 0, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, rgba(244,244,249,0.25), rgba(244,244,249,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover; opacity: 1;
        }
        [data-theme="dark"] body::before {
            background: linear-gradient(to bottom, rgba(15,15,30,0.25), rgba(15,15,30,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover;
        }

        /* ---- Header / nav (mirrors index.html) ---- */
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); padding: 1rem 1.5rem; transition: all 0.3s ease; }
        [data-theme="dark"] header { background: rgba(15, 15, 30, 0.95); }
        header.scrolled { box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2); padding: 0.75rem 1.5rem; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: white; letter-spacing: 0.05em; text-decoration: none; transition: transform 0.3s ease; display: flex; align-items: center; }
        .logo-image { height: 50px; width: auto; transition: transform 0.3s ease; }
        header.scrolled .logo-image { height: 40px; }
        .logo:active { transform: scale(0.95); }
        .logo:hover .logo-image { transform: scale(1.05); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .theme-toggle { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); color: white; width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; backdrop-filter: blur(5px); -webkit-tap-highlight-color: transparent; }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.2); transform: rotate(20deg) scale(1.1); }
        .theme-toggle:active { transform: rotate(20deg) scale(0.95); }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; position: relative; transition: color 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-links a:hover::after, .nav-links a:active::after { width: 100%; }
        .nav-links a:hover { color: var(--primary); }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; min-width: 44px; min-height: 44px; -webkit-tap-highlight-color: transparent; transition: transform 0.2s ease; }
        .menu-toggle:active { transform: scale(0.9); }
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .logo-image { height: 40px; }
            header.scrolled .logo-image { height: 35px; }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .nav-right { gap: 1rem; }
            .nav-links { position: fixed; top: 70px; left: 0; right: 0; background: rgba(26, 26, 46, 0.98); flex-direction: column; gap: 0; padding: 2rem; transform: translateY(-100%); opacity: 0; transition: all 0.3s ease; pointer-events: none; max-height: calc(100vh - 70px); overflow-y: auto; }
            [data-theme="dark"] .nav-links { background: rgba(15, 15, 30, 0.98); }
            .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links li { padding: 1.25rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .nav-links li:last-child { border-bottom: none; }
            .nav-links a { font-size: 1.1rem; display: block; padding: 0.5rem 0; }
        }

        /* ---- Page body ---- */
        main { flex: 1; width: 100%; padding-top: 110px; max-width: 1200px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; padding-bottom: 4rem; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 7vw, 4rem); text-align: center; letter-spacing: 0.05em; color: var(--text-primary); margin: 1rem 0 0.25rem; }
        .page-subtitle { text-align: center; color: rgba(255, 255, 255, 0.94); font-size: 1rem; margin-bottom: 2rem; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }

        /* ---- Event sections ---- */
        .events-section { margin-bottom: 2.75rem; }
        .events-section-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--border-color); }
        .events-section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: 0.04em; color: var(--text-primary); }
        .events-group-head { margin: 2.25rem 0 0.85rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--border-color); }
        .events-group-head .events-section-title { font-size: clamp(1.9rem, 5vw, 2.6rem); }
        .events-group-sub { margin: 0.15rem 0 0; color: var(--text-muted); font-size: 0.95rem; }
        .events-empty { color: var(--text-muted); padding: 0.4rem 0 1rem; }
        .events-section.live .events-section-title { color: var(--primary); }
        .events-section-count { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        .live-dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--primary); display: inline-block; box-shadow: 0 0 0 0 rgba(255,107,53,0.6); animation: pulse 1.8s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,53,0.6); } 70% { box-shadow: 0 0 0 10px rgba(255,107,53,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); } }

        .events-grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        @media (max-width: 560px) { .events-grid { grid-template-columns: 1fr; } }

        .event-card { background: var(--bg-secondary); border-radius: 15px; overflow: hidden; border: 2px solid var(--border-color); transition: all 0.3s ease; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: flex; flex-direction: column; padding: 1.4rem; gap: 0.7rem; box-shadow: 0 6px 24px var(--card-shadow); }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px var(--card-shadow-hover); border-color: var(--primary); }
        .event-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .event-card.live { border-color: var(--primary); box-shadow: 0 8px 30px rgba(255, 107, 53, 0.25); }
        .event-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
        .event-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.45rem; line-height: 1.1; color: var(--text-primary); letter-spacing: 0.02em; }
        .event-meta { font-size: 0.9rem; color: var(--text-tertiary); display: flex; flex-direction: column; gap: 0.3rem; }
        .event-meta .meta-row { display: flex; align-items: center; gap: 0.4rem; }
        /* External "register" CTA on schedule-feed (linked) cards */
        .event-cta { margin-top: auto; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--primary); }
        /* In-house sign-up cards (members or guests) */
        .register-card { cursor: default; }
        .register-card .register-fee { font-size: 0.9rem; color: var(--text-secondary); }
        .register-card .register-status { font-weight: 700; color: var(--green, #2e7d32); }
        .register-form { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.2rem; }
        .reg-input { padding: 0.55rem 0.65rem; border: 1px solid var(--border-color); border-radius: 8px; font: inherit; font-size: 0.9rem; background: var(--bg-primary); color: var(--text-primary); }
        .register-addon { display: flex; align-items: center; gap: 0.45rem; font-size: 0.88rem; color: var(--text-secondary); cursor: pointer; }
        .reg-btn { margin-top: 0.35rem; background: var(--primary); color: #fff; border: none; padding: 0.6rem 1.4rem; min-height: 42px; border-radius: 50px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; align-self: flex-start; transition: filter 0.2s ease; }
        .reg-btn:hover { filter: brightness(1.07); }
        .reg-btn:disabled { opacity: 0.6; cursor: default; }
        .reg-btn.secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        #registerSection, #casualRoundsSection { background: rgba(244, 244, 249, 0.94); margin: 0 -1.5rem 2rem; padding: 1.25rem 1.5rem 1.5rem; }
        #registerSection { border-radius: 0 0 16px 16px; }
        #casualRoundsSection { border-radius: 16px; }
        [data-theme="dark"] #registerSection, [data-theme="dark"] #casualRoundsSection { background: rgba(15, 15, 30, 0.86); }
        #registerSection .events-group-head, #casualRoundsSection .events-group-head { margin-top: 0; }
        .casual-board { display: grid; gap: 1rem; }
        .casual-form { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px; padding: 1rem; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; align-items: end; box-shadow: 0 6px 24px var(--card-shadow); }
        .casual-field { display: flex; flex-direction: column; gap: 0.35rem; color: var(--text-secondary); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .casual-field.notes { grid-column: span 2; }
        .casual-notes { min-height: 42px; resize: vertical; }
        .casual-status { grid-column: 1 / -1; min-height: 1.2rem; color: var(--text-muted); font-size: 0.88rem; }
        .casual-status.error { color: #c8102e; }
        .casual-list { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        .casual-card { cursor: default; }
        .casual-card:hover { transform: none; border-color: var(--border-color); }
        .casual-meta-label { min-width: 4.2rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em; }
        .casual-players { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.45; }
        .casual-actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: auto; }
        .casual-actions .reg-btn { margin-top: 0; }
        .casual-link { text-decoration: none; display: inline-flex; align-items: center; }
        @media (max-width: 760px) {
            .casual-form { grid-template-columns: 1fr; }
            .casual-field.notes { grid-column: auto; }
            .casual-list { grid-template-columns: 1fr; }
            #casualRoundsSection .events-group-head { padding-left: 56px; min-height: 54px; }
        }
        /* Keep-score CTA on a live event */
        .btn-keep-score { display: inline-block; margin: 0.25rem 0 0.75rem; background: var(--primary); color: #fff; text-decoration: none; font-weight: 800; padding: 0.7rem 1.3rem; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.9rem; }
        .btn-keep-score:hover { filter: brightness(1.07); }
        .event-meta .meta-icon { opacity: 0.8; }

        /* ---- Badges ---- */
        .badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
        .type-badge { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        [data-theme="dark"] .type-badge { background: var(--bg-primary); }
        .type-badge.tournament { background: linear-gradient(135deg, var(--primary), #cc4a1a); color: white; border: none; }
        .type-badge.league_round { background: linear-gradient(135deg, var(--secondary), var(--green)); color: white; border: none; }
        .type-badge.fundraiser { background: linear-gradient(135deg, var(--accent), #e5a600); color: var(--dark); border: none; }
        .type-badge.meeting { background: var(--bg-tertiary); color: var(--text-secondary); }
        .status-badge { font-size: 0.68rem; }
        .status-badge.live { background: var(--primary); color: white; }
        .status-badge.scheduled { background: rgba(0, 78, 137, 0.15); color: var(--secondary-text); }
        [data-theme="dark"] .status-badge.scheduled { background: rgba(47, 127, 196, 0.25); color: #7fb3e0; }
        .status-badge.final { background: var(--bg-tertiary); color: var(--text-muted); border: 1px solid var(--border-color); }
        .status-badge.cancelled { background: rgba(200, 16, 46, 0.15); color: #c8102e; text-decoration: line-through; }
        [data-theme="dark"] .status-badge.cancelled { color: #e63950; }

        /* ---- Detail view ---- */
        .detail-card { background: var(--bg-secondary); border-radius: 18px; padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: 0 10px 40px var(--card-shadow); border: 1px solid rgba(0, 78, 137, 0.08); margin-bottom: 1.5rem; }
        [data-theme="dark"] .detail-card { border-color: rgba(255, 255, 255, 0.05); }
        .detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
        .detail-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: 0.03em; color: var(--text-primary); flex: 1 1 100%; }
        .detail-facts { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 1.5rem 0; }
        .detail-fact { background: var(--bg-tertiary); border-radius: 12px; padding: 1rem; }
        [data-theme="dark"] .detail-fact { background: var(--bg-primary); }
        .detail-fact .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
        .detail-fact .value { font-size: 1rem; color: var(--text-secondary); font-weight: 600; word-break: break-word; }
        .detail-fact .value a { color: var(--primary); text-decoration: none; }
        .detail-fact .value a:hover { text-decoration: underline; }
        .detail-notes { background: var(--bg-tertiary); border-left: 4px solid var(--accent); border-radius: 8px; padding: 1rem 1.25rem; margin: 1.25rem 0; color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap; }
        [data-theme="dark"] .detail-notes { background: var(--bg-primary); }
        .live-banner { display: flex; align-items: center; gap: 0.6rem; background: linear-gradient(135deg, var(--primary), #cc4a1a); color: white; border-radius: 12px; padding: 1rem 1.25rem; margin: 1.25rem 0; font-weight: 700; }
        .live-banner .leaderboard-link { margin-left: auto; color: white; text-decoration: underline; font-size: 0.9rem; font-weight: 600; }
        .live-weather { margin: -0.3rem 0 0.85rem; }
        .weather-strip { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-left: 4px solid var(--secondary); border-radius: 12px; padding: 0.85rem 1rem; }
        [data-theme="dark"] .weather-strip { background: var(--bg-primary); }
        .weather-title { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem; }
        .weather-chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
        .weather-chip { display: inline-flex; align-items: baseline; gap: 0.3rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 999px; color: var(--text-secondary); padding: 0.25rem 0.6rem; font-size: 0.82rem; line-height: 1.25; }
        .weather-chip strong { color: var(--text-muted); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .weather-note { margin-top: 0.5rem; color: var(--text-muted); font-size: 0.78rem; line-height: 1.4; }
        .lb-conn { margin-left: auto; font-size: 0.78rem; font-weight: 700; opacity: 0.9; }
        .lb-wrap { margin: 0.25rem 0 1.25rem; }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .lb-table th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 0.4rem 0.6rem; border-bottom: 2px solid var(--border-color); }
        .lb-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); }
        .lb-table tbody tr:first-child td { font-weight: 700; color: var(--text-primary); }
        .lb-pos { width: 2.5rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .lb-name { font-weight: 600; color: var(--text-primary); }
        .lb-topar { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
        .lb-topar.under { color: #2e9e44; }
        .lb-topar.over { color: var(--primary); }
        .lb-empty { color: var(--text-muted); padding: 0.75rem 0; font-style: italic; }
        .res-chips { font-size: 0.8rem; color: var(--text-muted); }
        .extras-list { margin: 0.25rem 0 1rem 1.25rem; color: var(--text-secondary); line-height: 1.7; }
        #leaguesSection { margin-bottom: 1.5rem; }
        .leagues-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 0.75rem; }
        .league-card { text-align: left; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.25rem; transition: border-color .15s, transform .15s; font: inherit; }
        .league-card:hover { border-color: var(--secondary); transform: translateY(-2px); }
        .league-name { font-weight: 700; color: var(--text-primary); }
        .league-meta { font-size: 0.8rem; color: var(--text-muted); }
        #fundraisersSection { margin-bottom: 1.5rem; }
        .fundraiser-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.25rem 1.5rem; margin-top: 0.75rem; }
        .fundraiser-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.03em; color: var(--text-primary); margin-bottom: 0.5rem; }
        .fr-bar { height: 12px; background: var(--bg-tertiary); border-radius: 999px; overflow: hidden; margin: 0.25rem 0; }
        .fr-bar-fill { height: 100%; background: linear-gradient(90deg, #2e9e44, #25c05a); border-radius: 999px; }
        .fr-progress { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .fundraiser-body { color: var(--text-secondary); line-height: 1.6; }
        .fundraiser-body p { margin: 0.5rem 0; } .fundraiser-body ul { margin: 0.5rem 0 0.5rem 1.25rem; }
        .donate-btn { display: inline-block; margin-top: 0.75rem; background: #2e9e44; color: #fff; padding: 0.6rem 1.25rem; border-radius: 10px; font-weight: 700; text-decoration: none; }
        .donate-btn:hover { background: #25883a; }
        .fr-share { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.85rem; }
        .fr-share-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .fr-share-btn { font: inherit; font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-secondary); text-decoration: none; cursor: pointer; }
        .fr-share-btn:hover { border-color: var(--secondary); color: var(--text-primary); }
        .fr-share-btn.fb { color: #1877f2; } .fr-share-btn.tw { color: var(--text-primary); }
        @keyframes lbflash { from { background: rgba(255,107,53,0.18); } to { background: transparent; } }
        .lb-table tbody tr.lb-upd td { animation: lbflash 0.9s ease-out; }

        .roster-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.03em; color: var(--text-primary); margin: 1.75rem 0 1rem; }
        .division-group { margin-bottom: 1.5rem; }
        .division-name { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary); font-weight: 700; margin-bottom: 0.6rem; }
        .player-list { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        .player-row { background: var(--bg-tertiary); border-radius: 10px; padding: 0.65rem 0.85rem; display: flex; align-items: baseline; gap: 0.5rem; border: 1px solid var(--border-color); }
        [data-theme="dark"] .player-row { background: var(--bg-primary); }
        .player-name { font-weight: 600; color: var(--text-secondary); }
        .player-pdga { font-size: 0.78rem; color: var(--text-muted); }
        .player-team { margin-left: auto; font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

        /* ---- States ---- */
        .status-box { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); }
        .status-box .spinner { width: 42px; height: 42px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 1rem; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-box.error { color: #c8102e; }
        [data-theme="dark"] .status-box.error { color: #e63950; }
        .status-box .empty-icon { font-size: 2.5rem; opacity: 0.6; margin-bottom: 0.5rem; }
        .retry-btn { margin-top: 1rem; background: var(--primary); color: white; border: none; padding: 0.75rem 1.75rem; min-height: 44px; border-radius: 50px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.3s ease; }
        .retry-btn:hover { background: #ff7f4d; transform: translateY(-2px); }
        .last-updated { text-align: center; color: rgba(255, 255, 255, 0.9); font-size: 0.8rem; margin-top: 1.5rem; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }
        .back-link { display: inline-block; margin-top: 0.5rem; color: rgba(255, 255, 255, 0.94); text-decoration: none; font-size: 0.95rem; background: none; border: none; cursor: pointer; font: inherit; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }
        .back-link:hover { color: var(--primary); }

        /* ---- Footer (mirrors index.html) ---- */
        footer { background: linear-gradient(135deg, var(--dark) 0%, #0d1a0d 100%); color: white; text-align: center; padding: 2.5rem 2rem; font-size: 0.95rem; border-top: 3px solid var(--accent); }
        [data-theme="dark"] footer { background: linear-gradient(135deg, var(--bg-secondary) 0%, #0a0a14 100%); }
        @media print { header, footer { display: none; } }

        /* ---- Tee signs (T4): per-hole official photo or SVG fallback ---- */
        .tee-signs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; margin-top: 0.5rem; }
        .ts-hole-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 0.6rem; background: var(--bg-primary); display: flex; flex-direction: column; gap: 0.4rem; }
        .ts-hole-photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: var(--bg-tertiary); }
        .ts-hole-svg { display: flex; justify-content: center; }
        .ts-hole-svg svg { width: 100%; height: auto; max-width: 100%; }
        .ts-hole-meta { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
        .ts-hole-num { color: var(--primary); font-weight: 700; }
        /* tee-sign.js SVG classes (mirrors tee-sign-preview.html), theme-aware */
        .tee-sign { color: var(--text-primary); }
        .tee-sign-bg { fill: var(--bg-secondary); stroke: var(--border-color); stroke-opacity: 0.7; }
        .tee-sign-hole { font: 700 44px 'Bebas Neue', system-ui, sans-serif; fill: currentColor; }
        .tee-sign-course { font: 600 14px system-ui, sans-serif; fill: currentColor; opacity: 0.7; }
        .tee-sign-rule { stroke: currentColor; stroke-opacity: 0.2; }

<body data-api-base="">
    <header>

</header>

    <main>
        <h1 class="page-title">Events &amp; Club Events</h1>

    <footer><p>&copy; 2026 Greenville Disc Golf Club. All rights reserved. | Greenville, NC</p></footer>

    <script src="weather-display.js"></script>
    <script type="module">
        import {
            bucketEvents,
            normalizeEvent,
            groupPlayersByDivision,
            buildCourseIndex,
            courseNameFor,
            formatEventDate,
            typeLabel,
            statusLabel,
        } from './events.js';
        import { teeSignNode } from './tee-sign.js';

        // --- Theme toggle (mirrors index.html) ---
        const themeToggle = document.querySelector('.theme-toggle');
        const themeIcon = document.querySelector('.theme-icon');
        const html = document.documentElement;
        const currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        themeIcon.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        themeToggle.addEventListener('click', () => {
            const t = html.getAttribute('data-theme');
            const n = t === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', n);
            localStorage.setItem('theme', n);
            themeIcon.textContent = n === 'dark' ? '☀️' : '🌙';
        });

        // --- Mobile menu (mirrors index.html) ---
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');
        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuToggle.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
        });
        document.querySelectorAll('.nav-links a').forEach((l) =>
            l.addEventListener('click', () => {
                navLinks.classList.remove('active');
                menuToggle.textContent = '☰';
            })
        );

        // --- Scrolled header shadow (mirrors index.html) ---
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            window.scrollY > 100 ? header.classList.add('scrolled') : header.classList.remove('scrolled');
        });

        // --- API wiring ---
        // Public read endpoints on the club Worker. Base is configurable on <body>
        // so the senior engineer can repoint it at a local Worker for testing.
        const LOCAL_API_BASE = ['127.0.0.1', 'localhost'].includes(location.hostname)
            ? 'http://127.0.0.1:8788'
            : '';
        // Explicit data-api-base wins; else resolve by host (prod vs the gvdgclub.com dev site / previews).
        const _h = location.hostname;
        const API_BASE = (
            LOCAL_API_BASE ||
            (document.body.dataset.apiBase || '').trim() ||
            ((_h === 'greenvillediscgolf.com' || _h === 'www.greenvillediscgolf.com')
                ? 'https://auth.greenvillediscgolf.com' : 'https://auth.gvdgclub.com')
        )
            .trim()
            .replace(/\/+$/, ''); // strip trailing slashes
        const REFRESH_MS = 60 * 1000; // ~60s background refresh on the hub

        const statusEl = document.getElementById('status');
        const registerEl = document.getElementById('registerSection');
        const casualEl = document.getElementById('casualRoundsSection');
        const calendarEl = document.getElementById('calendarEvents');
        const hubEl = document.getElementById('hub');
        const leaguesEl = document.getElementById('leaguesSection');
        const clubEl = document.getElementById('clubEventsSection');
        const fundraisersEl = document.getElementById('fundraisersSection');
        const meetingsEl = document.getElementById('meetingsSection');
        const detailEl = document.getElementById('detail');
        const lastUpdatedEl = document.getElementById('lastUpdated');

        // In-memory caches so navigating hub <-> detail doesn't refetch needlessly.
        let courseIndex = new Map();
        let coursesCache = [];
        let layoutsCache = new Map();
        let coursesLoaded = false;
        let refreshTimer = null;

        // --- XSS-safe DOM helper (mirrors ryder-cup.html) ---
        // Every piece of API data lands here as a text node; we NEVER assign
        // innerHTML with API data anywhere in this file.
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        // Build a safe external anchor. href is sanitized to http(s) only so a
        // hostile external_url/udisc_url can't inject a javascript: URL.
        function safeLink(href, text) {
            const a = el('a', null, text);
            const clean = sanitizeUrl(href);
            if (clean) {
                a.href = clean;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
            }
            return a;
        }
        function sanitizeUrl(raw) {
            if (!raw) return '';
            try {
                const u = new URL(String(raw), window.location.href);
                return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
            } catch (_e) {
                return '';
            }
        }

        function setView(which) {
            statusEl.hidden = which !== 'status';
            registerEl.hidden = which !== 'hub';
            casualEl.hidden = which !== 'hub';
            calendarEl.hidden = which !== 'hub';
            hubEl.hidden = which !== 'hub';
            leaguesEl.hidden = which !== 'hub';
            clubEl.hidden = which !== 'hub';
            fundraisersEl.hidden = which !== 'hub';
            meetingsEl.hidden = which !== 'hub';
            detailEl.hidden = which !== 'detail';
        }

        // A group heading (e.g. "Events", "Club Events") with a one-line description.
        function groupHeading(title, sub) {
            const wrap = el('div', 'events-group-head');
            wrap.appendChild(el('h2', 'events-section-title', title));
            if (sub) wrap.appendChild(el('p', 'events-group-sub', sub));
            return wrap;
        }

        // Render a schedule-feed list (Google Sheet items: {name, date, detail, url}) as linked cards.
        function feedList(items) {
            const grid = el('div', 'events-grid');
            for (const it of items) {
                const clean = sanitizeUrl(it.url);
                const card = el(clean ? 'a' : 'div', 'event-card');
                if (clean) { card.href = clean; card.target = '_blank'; card.rel = 'noopener noreferrer'; }
                const top = el('div', 'event-card-top');
                top.appendChild(el('h3', 'event-name', it.name));
                card.appendChild(top);
                const meta = el('div', 'event-meta');
                const dateRow = el('div', 'meta-row');
                dateRow.appendChild(el('span', 'meta-icon', '📅'));
                dateRow.appendChild(el('span', null, it.date || 'TBD'));
                meta.appendChild(dateRow);
                if (it.detail) {
                    const dRow = el('div', 'meta-row');
                    dRow.appendChild(el('span', 'meta-icon', '📍'));
                    dRow.appendChild(el('span', null, it.detail));
                    meta.appendChild(dRow);
                }
                card.appendChild(meta);
                // When the schedule row carries a link (Disc Golf Scene / PDGA), make registering explicit.
                if (clean) card.appendChild(el('div', 'event-cta', 'Register / Details ↗'));
                grid.appendChild(card);
            }
            return grid;
        }

        function showStatus(message, isError, onRetry) {
            setView('status');
            statusEl.className = 'status-box' + (isError ? ' error' : '');
            statusEl.replaceChildren();
            if (isError) {
                statusEl.appendChild(el('div', null, message));
                const btn = el('button', 'retry-btn', 'Retry');
                btn.type = 'button';
                btn.addEventListener('click', onRetry || route);
                statusEl.appendChild(btn);
            } else {
                statusEl.appendChild(el('div', 'spinner'));
                statusEl.appendChild(el('div', null, message));
            }
        }

        function showEmpty(message) {
            setView('status');
            statusEl.className = 'status-box';
            statusEl.replaceChildren();
            statusEl.appendChild(el('div', 'empty-icon', '🥏'));
            statusEl.appendChild(el('div', null, message));
        }

        async function fetchJson(path) {
            const res = await fetch(`${API_BASE}${path}`, {
                cache: 'no-store',
                headers: { Accept: 'application/json' },
            });
            if (!res.ok) throw new Error(`Request failed (${res.status})`);
            return res.json();
        }

        // Lazily load /courses once so cards/detail can show a course name.
        async function ensureCourses() {
            if (coursesLoaded) return;
            try {
                const data = await fetchJson('/courses');
                coursesCache = Array.isArray(data && data.courses) ? data.courses : [];
                courseIndex = buildCourseIndex(coursesCache);
            } catch (_e) {
                // Course names are a nicety — never block events on this.
                coursesCache = [];
                courseIndex = new Map();
            }
            coursesLoaded = true;
        }

        // ---------- HUB ----------
        function badge(text, classes) {
            const b = el('span', 'badge ' + classes, text);
            return b;
        }

        function eventCard(ev) {
            // Use a <button> so the card is keyboard-focusable + screen-reader friendly.
            const card = el('button', 'event-card' + (ev.status === 'live' ? ' live' : ''));
            card.type = 'button';
            card.addEventListener('click', () => {
                window.location.hash = `#event/${encodeURIComponent(ev.id)}`;
            });

            const top = el('div', 'event-card-top');
            top.appendChild(el('h3', 'event-name', ev.name));
            if (ev.type) top.appendChild(badge(typeLabel(ev.type), 'type-badge ' + ev.type));
            card.appendChild(top);

            const meta = el('div', 'event-meta');
            const dateRow = el('div', 'meta-row');
            dateRow.appendChild(el('span', 'meta-icon', '📅'));
            dateRow.appendChild(el('span', null, formatEventDate(ev.date)));
            meta.appendChild(dateRow);

            const courseName = courseNameFor(courseIndex, ev.course_id);
            if (courseName) {
                const courseRow = el('div', 'meta-row');
                courseRow.appendChild(el('span', 'meta-icon', '📍'));
                courseRow.appendChild(el('span', null, courseName));
                meta.appendChild(courseRow);
            }
            card.appendChild(meta);

            if (ev.status) {
                const statusRow = el('div', 'event-card-top');
                statusRow.appendChild(badge(statusLabel(ev.status), 'status-badge ' + ev.status));
                card.appendChild(statusRow);
            }
            return card;
        }

        function section(title, events, opts = {}) {
            const wrap = el('section', 'events-section' + (opts.live ? ' live' : ''));
            const head = el('div', 'events-section-head');
            if (opts.live) head.appendChild(el('span', 'live-dot'));
            head.appendChild(el('h2', 'events-section-title', title));
            head.appendChild(el('span', 'events-section-count', `${events.length} event${events.length === 1 ? '' : 's'}`));
            wrap.appendChild(head);

            const grid = el('div', 'events-grid');
            for (const ev of events) grid.appendChild(eventCard(ev));
            wrap.appendChild(grid);
            return wrap;
        }

        // Render the two club categories: Events (schedule feed + any club-scored D1 events) and the
        // Club Events heading (fundraisers/meetings render into their own sections just below).
        function renderPage(feed, d1events) {
            const feedEvents = (feed && feed.events) || [];
            const { live, upcoming, past } = bucketEvents(d1events || []);

            calendarEl.replaceChildren();
            calendarEl.appendChild(groupHeading('Events', 'Disc golf tournaments & league rounds'));
            if (feedEvents.length) calendarEl.appendChild(feedList(feedEvents));

            hubEl.replaceChildren();
            if (live.length) hubEl.appendChild(section('Live Now', live, { live: true }));
            if (upcoming.length) hubEl.appendChild(section('Club-scored — Upcoming', upcoming));
            if (past.length) hubEl.appendChild(section('Club-scored — Past', past));
            if (!feedEvents.length && !live.length && !upcoming.length && !past.length) {
                calendarEl.appendChild(el('p', 'events-empty', 'No tournaments or league rounds are on the schedule right now.'));
            }

            clubEl.replaceChildren();
            clubEl.appendChild(groupHeading('Club Events', 'Fundraisers, meetings & minutes'));
            const feedClub = (feed && feed.clubEvents) || [];
            if (feedClub.length) clubEl.appendChild(feedList(feedClub));

            setView('hub');
            lastUpdatedEl.hidden = false;
            lastUpdatedEl.textContent =
                'Last updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function loadHub() {
            teardownLive(); // close any live socket from a detail view
            showStatus('Loading…', false);
            try {
                // Courses first (best-effort) so cards can show names on first paint.
                await ensureCourses();
                const [feed, d1] = await Promise.all([
                    fetchJson('/club-feed').catch(() => ({ events: [], clubEvents: [] })),
                    fetchJson('/events').catch(() => ({ events: [] })),
                ]);
                renderPage(feed, (d1 && d1.events) || []);
                loadRegistration(); // best-effort; club events open for sign-up
                loadCasualRounds();
                loadLeaguesList(); // best-effort; standings live behind each league
                loadFundraisers();
                loadMeetings();
            } catch (_err) {
                lastUpdatedEl.hidden = true;
                showStatus('We couldn’t load the calendar right now. Please try again.', true, loadHub);
            }
        }

        // ---------- Safe markdown (XSS-safe: textContent + createElement only; http(s) links only) ----------
        function appendInline(parent, text) {
            const re = /\*\*([^*]+)\*\*|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
            let last = 0, m;
            while ((m = re.exec(text)) !== null) {
                if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
                if (m[1] != null) { const s = document.createElement('strong'); s.textContent = m[1]; parent.appendChild(s); }
                else { const a = document.createElement('a'); a.href = m[3]; a.textContent = m[2]; a.target = '_blank'; a.rel = 'noopener noreferrer'; parent.appendChild(a); }
                last = re.lastIndex;
            }
            if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
        }
        function safeMd(md, container) {
            container.replaceChildren();
            String(md || '').split(/\n\s*\n/).forEach((block) => {
                const lines = block.split('\n').filter((l) => l.trim() !== '');
                if (!lines.length) return;
                if (lines.every((l) => /^\s*-\s+/.test(l))) {
                    const ul = document.createElement('ul');
                    lines.forEach((l) => { const li = document.createElement('li'); appendInline(li, l.replace(/^\s*-\s+/, '')); ul.appendChild(li); });
                    container.appendChild(ul);
                } else if (/^#{1,3}\s+/.test(lines[0])) {
                    const h = document.createElement('h4'); appendInline(h, lines[0].replace(/^#{1,3}\s+/, '')); container.appendChild(h);
                    if (lines.length > 1) { const p = document.createElement('p'); appendInline(p, lines.slice(1).join('\n')); container.appendChild(p); }
                } else {
                    const p = document.createElement('p');
                    lines.forEach((l, i) => { if (i) p.appendChild(document.createElement('br')); appendInline(p, l); });
                    container.appendChild(p);
                }
            });
        }

        // Social share buttons -> the donation page. URLs are app-controlled with encodeURIComponent'd
        // params (no injection); links open in a new tab. Copy uses the clipboard API.
        function shareRow(donateUrl, title) {
            const wrap = el('div', 'fr-share');
            wrap.appendChild(el('span', 'fr-share-label', 'Share:'));
            const eu = encodeURIComponent(donateUrl);
            const et = encodeURIComponent(`Support ${title} — Greenville Disc Golf Club`);
            const mk = (cls, label, href, newTab) => {
                const a = el('a', 'fr-share-btn ' + cls, label);
                a.href = href; a.rel = 'noopener noreferrer'; if (newTab) a.target = '_blank';
                return a;
            };
            wrap.appendChild(mk('fb', 'Facebook', `https://www.facebook.com/sharer/sharer.php?u=${eu}`, true));
            wrap.appendChild(mk('tw', 'X', `https://twitter.com/intent/tweet?url=${eu}&text=${et}`, true));
            wrap.appendChild(mk('em', 'Email', `mailto:?subject=${et}&body=${et}%0A%0A${eu}`, false));
            const copy = el('button', 'fr-share-btn copy', 'Copy link'); copy.type = 'button';
            copy.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(donateUrl); copy.textContent = 'Copied!'; }
                catch (_e) { copy.textContent = 'Copy failed'; }
                setTimeout(() => { copy.textContent = 'Copy link'; }, 1600);
            });
            wrap.appendChild(copy);
            return wrap;
        }

        // ---------- REGISTER (club events open for sign-up; members or guests) ----------
        function dollars(c) { return '$' + (Math.round(Number(c) || 0) / 100).toFixed(2).replace(/\.00$/, ''); }
        function memberToken() { try { return sessionStorage.getItem('gvdg_member_token') || null; } catch (_e) { return null; } }
        const GUEST_REG_KEY = 'gvdg_guest_regs'; // { [eventId]: { guestToken, name } } — lets a guest manage their sign-up
        function guestRegs() { try { return JSON.parse(localStorage.getItem(GUEST_REG_KEY) || '{}'); } catch (_e) { return {}; } }
        function setGuestReg(eventId, val) {
            const all = guestRegs();
            if (val) all[eventId] = val; else delete all[eventId];
            try { localStorage.setItem(GUEST_REG_KEY, JSON.stringify(all)); } catch (_e) {}
        }
        async function regApi(path, opts) {
            const o = opts || {};
            const headers = { Accept: 'application/json' };
            if (o.body) headers['Content-Type'] = 'application/json';
            if (o.token) headers.Authorization = 'Bearer ' + o.token;
            return fetch(API_BASE + path, { method: o.method || 'GET', cache: 'no-store', headers, body: o.body ? JSON.stringify(o.body) : undefined });
        }
        function clientOwed(ev, addons) {
            let c = ev.entry_fee_cents || 0;
            if (addons && addons.ctp && ev.ctp_fee_cents) c += ev.ctp_fee_cents;
            if (addons && addons.ace && ev.ace_fee_cents) c += ev.ace_fee_cents;
            return c;
        }
        function addonCheckbox(form, label) {
            const l = el('label', 'register-addon');
            const cb = document.createElement('input'); cb.type = 'checkbox';
            l.appendChild(cb); l.appendChild(document.createTextNode(' ' + label));
            form.appendChild(l);
            return cb;
        }
        async function loadRegistration() {
            registerEl.replaceChildren();
            let events = [];
            try { const d = await fetchJson('/registration/open'); events = (d && d.events) || []; } catch (_e) { return; }
            if (!events.length) return; // nothing open — show nothing rather than an empty heading
            let myRegs = {};
            const tok = memberToken();
            if (tok) {

        function regCard(ev, myReg, guestReg) {

            card.appendChild(el('div', 'register-fee', (ev.entry_fee_cents ? dollars(ev.entry_fee_cents) + ' entry' : 'Free entry') + (ev.play_format ? ' · ' + ev.play_format : '')));

            const tok = memberToken();
            if (myReg || guestReg) {
                const who = myReg ? (myReg.division ? ' — ' + myReg.division : '') : (guestReg.name ? ' — ' + guestReg.name : '');
                card.appendChild(el('div', 'register-status', '✅ Registered' + who));
                let regAddons = {}; try { regAddons = JSON.parse((myReg && myReg.addons) || '{}'); } catch (_e) {}
                const owed = clientOwed(ev, regAddons);
                if (owed > 0 && !(myReg && myReg.paid_entry)) {
                    card.appendChild(el('div', 'register-fee', 'Amount due: ' + dollars(owed) + ' — pay at the event' + (tok ? ' or in the Members area.' : '.')));
                }
                const wd = el('button', 'reg-btn secondary', 'Withdraw'); wd.type = 'button';
                wd.addEventListener('click', async () => {
                    if (!confirm('Withdraw from ' + ev.name + '?')) return;
                    const path = '/events/' + ev.id + '/register' + (guestReg ? '?gt=' + encodeURIComponent(guestReg.guestToken) : '');
                    const r = await regApi(path, { method: 'DELETE', token: myReg ? tok : undefined });
                    if (r.ok) { if (guestReg) setGuestReg(ev.id, null); loadRegistration(); return; }
                    const e = await r.json().catch(() => ({}));
                    alert(e.error === 'paid_contact_admin' ? 'You have already paid — please contact an admin to withdraw.' : 'Withdraw failed — please try again.');
                });
                card.appendChild(wd);
                return card;
            }

            const form = el('div', 'register-form');
            let nameInput = null, emailInput = null;
            if (!tok) {
                nameInput = document.createElement('input'); nameInput.type = 'text'; nameInput.placeholder = 'Your name'; nameInput.maxLength = 80; nameInput.className = 'reg-input';
                emailInput = document.createElement('input'); emailInput.type = 'email'; emailInput.placeholder = 'Email (optional)'; emailInput.maxLength = 120; emailInput.className = 'reg-input';
                form.appendChild(nameInput); form.appendChild(emailInput);
            }
            let divs = []; try { divs = JSON.parse(ev.divisions || '[]'); } catch (_e) {}
            let divSel = null;
            if (divs.length) { divSel = document.createElement('select'); divSel.className = 'reg-input'; divs.forEach((d) => { const o = document.createElement('option'); o.value = d; o.textContent = d; divSel.appendChild(o); }); form.appendChild(divSel); }
            const ctpCb = ev.ctp_fee_cents ? addonCheckbox(form, 'CTP pot ' + dollars(ev.ctp_fee_cents)) : null;
            const aceCb = ev.ace_fee_cents ? addonCheckbox(form, 'Ace pot ' + dollars(ev.ace_fee_cents)) : null;
            const btn = el('button', 'reg-btn', 'Register'); btn.type = 'button';
            btn.addEventListener('click', async () => {
                const body = { division: divSel ? divSel.value : null, addons: { ctp: !!(ctpCb && ctpCb.checked), ace: !!(aceCb && aceCb.checked) } };
                if (!tok) {
                    const nm = (nameInput.value || '').trim();
                    if (!nm) { alert('Please enter your name.'); nameInput.focus(); return; }
                    body.name = nm;
                    const em = (emailInput.value || '').trim(); if (em) body.email = em;
                }
                btn.disabled = true;
                const r = await regApi('/events/' + ev.id + '/register', { method: 'POST', token: tok || undefined, body });
                btn.disabled = false;
                if (!r.ok) {
                    const e = await r.json().catch(() => ({}));
                    if (r.status === 401 || e.error === 'session_expired') {
                        try { sessionStorage.removeItem('gvdg_member_token'); } catch (_e) {}
                        alert('Your members session expired. Registering as a guest below — or sign in again on the Members page.');
                        loadRegistration(); // re-render: with no token the form now asks for name/email (guest)
                        return;
                    }
                    alert(e.error === 'registration_closed' ? 'Registration is closed for this event.'
                        : e.error === 'rate_limited' ? 'Too many sign-ups from your network — please try again in a minute.'
                        : e.error === 'invalid_division' ? 'Please pick a valid division.'
                        : 'Registration could not be completed.');
                    return;
                }
                const d = await r.json().catch(() => ({}));
                if (!tok && d.guestToken) setGuestReg(ev.id, { guestToken: d.guestToken, name: body.name });
                loadRegistration();
            });
            form.appendChild(btn);

            return card;
        }

        function currentMemberId() {
            const tok = memberToken();
            if (!tok) return null;
            try {
                const raw = tok.split('.')[1];
                if (!raw) return null;
                const padded = raw.replace(/-/g, '+').replace(/_/g, '/');
                const json = JSON.parse(atob(padded + '='.repeat((4 - padded.length % 4) % 4)));
                return typeof json.sub === 'string' ? json.sub : null;
            } catch (_e) {
                return null;
            }
        }

        function localDateTimeValue(ms) {
            const d = new Date(ms);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function formatRoundTime(raw) {
            const d = new Date(raw);
            if (!Number.isFinite(d.getTime())) return raw || 'Time TBD';
            return d.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        }

        async function layoutsForCourse(courseId) {
            const key = String(courseId);
            if (layoutsCache.has(key)) return layoutsCache.get(key) || [];
            try {
                const data = await fetchJson(`/courses/${encodeURIComponent(courseId)}/layouts`);
                const layouts = Array.isArray(data && data.layouts) ? data.layouts : [];
                layoutsCache.set(key, layouts);
                return layouts;
            } catch (_e) {
                layoutsCache.set(key, []);
                return [];
            }
        }

            async function fillLayouts() {
                layoutSel.replaceChildren();
                const courseId = courseSel.value;
                const layouts = courseId ? await layoutsForCourse(courseId) : [];
                layouts.forEach((l) => {
                    if (l && l.id != null) {

                        o.value = String(l.id);
                        o.textContent = l.name || 'Layout';

                else if (!layouts.length) status.textContent = 'No layouts are available for this course.';
                else status.textContent = '';

            courseSel.addEventListener('change', fillLayouts);
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                status.className = 'casual-status';

                    return;
                }
                btn.disabled = true;
                status.textContent = 'Posting...';
                const r = await regApi('/casual-rounds', {
                    method: 'POST',
                    token: tok,
                    body: {
                        course_id: Number(courseSel.value),
                        layout_id: Number(layoutSel.value),
                        starts_at: starts.toISOString(),
                        notes: notes.value.trim() || null,
                    },

            form.appendChild(courseField);

        function teardownLive() {

            if (activeLive.poll) clearInterval(activeLive.poll);

        function fmtToPar(n) { n = n || 0; return n === 0 ? 'E' : (n > 0 ? '+' + n : String(n)); }
        function renderStandings(container, snap) {
            const standings = (snap && snap.standings) || [];
            container.replaceChildren();
            if (!standings.length) { container.appendChild(el('p', 'lb-empty', 'Waiting for the first scores…')); return; }
            const hasDiv = standings.some((s) => s && s.division);
            const matchplay = snap && (snap.format === 'matchplay' || standings.some((s) => s && s.matchLabel));
            const table = el('table', 'lb-table');
            const thead = el('thead'); const htr = el('tr');
            const cols = hasDiv ? ['Pos', matchplay ? 'Side' : 'Player', 'Div', 'Thru', 'Total', matchplay ? 'Match' : 'To Par'] : ['Pos', matchplay ? 'Side' : 'Player', 'Thru', 'Total', matchplay ? 'Match' : 'To Par'];
            cols.forEach((h) => htr.appendChild(el('th', null, h)));
            thead.appendChild(htr); table.appendChild(thead);
            const tbody = el('tbody');
            standings.forEach((s, i) => {
                const tr = el('tr');
                tr.appendChild(el('td', 'lb-pos', String(i + 1)));
                tr.appendChild(el('td', 'lb-name', s && s.name != null ? String(s.name) : 'Player'));
                if (hasDiv) tr.appendChild(el('td', null, (s && s.division) || '—'));
                tr.appendChild(el('td', null, s && s.thru ? String(s.thru) : '—'));
                tr.appendChild(el('td', null, s && s.total != null && s.thru ? String(s.total) : '—'));
                const tp = el('td', 'lb-topar', matchplay ? ((s && s.matchLabel) || 'E') : (s && s.thru ? fmtToPar(s.toPar) : '—'));
                if (s && s.thru && !matchplay) { if ((s.toPar || 0) < 0) tp.classList.add('under'); else if ((s.toPar || 0) > 0) tp.classList.add('over'); }
                tr.appendChild(tp);
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }
        function renderLiveSnapshot(container, weatherEl, snap) {
            if (window.GVDGWeather && weatherEl) window.GVDGWeather.renderWeather(weatherEl, snap && snap.weather, { title: 'Round weather' });
            renderStandings(container, snap);
        }
        function mountLiveLeaderboard(eventId, container, statusEl, weatherEl) {
            teardownLive();
            const ctx = { ws: null, poll: null, gotWs: false };
            activeLive = ctx;
            const setConn = (t) => { if (statusEl) statusEl.textContent = t; };
            const pollOnce = async () => { try { const d = await fetchJson(`/events/${encodeURIComponent(eventId)}/live`); if (activeLive === ctx) renderLiveSnapshot(container, weatherEl, d); } catch (_e) {} };
            const startPolling = () => { if (ctx.poll || activeLive !== ctx) return; setConn('live (auto-refresh)'); pollOnce(); ctx.poll = setInterval(pollOnce, 5000); };
            try {
                const wsUrl = API_BASE.replace(/^http/, 'ws') + `/events/${encodeURIComponent(eventId)}/live/ws`;
                const ws = new WebSocket(wsUrl);
                ctx.ws = ws;
                ws.onopen = () => { ctx.gotWs = true; setConn('● live'); };
                ws.onmessage = (e) => { try { if (activeLive === ctx) renderLiveSnapshot(container, weatherEl, JSON.parse(e.data)); } catch (_e) {} };
                ws.onerror = () => { if (!ctx.gotWs) startPolling(); };
                ws.onclose = () => { if (!ctx.gotWs && activeLive === ctx) startPolling(); };
                setTimeout(() => { if (!ctx.gotWs) startPolling(); }, 4000); // fallback if the upgrade stalls
            } catch (_e) { startPolling(); }
        }

        // ---- Final results (R2 / club archive): rendered for finalized events ----
        function fmtBreakdown(raw) {
            let b = {}; try { b = JSON.parse(raw || '{}') || {}; } catch (_e) {}
            const parts = [];
            const add = (n, label) => { if (b[n]) parts.push(b[n] + ' ' + label + (b[n] > 1 ? 's' : '')); };
            add('aces', 'ace'); add('eagles', 'eagle'); add('birdies', 'birdie'); add('pars', 'par'); add('bogeys', 'bogey'); add('doubles_plus', 'dbl+');
            return parts.join(' · ');
        }
        async function renderFinalResults(eventId, container, courseId) {
            let results = [];
            try { const d = await fetchJson(`/events/${encodeURIComponent(eventId)}/results`); results = (d && d.results) || []; } catch (_e) {}
            container.replaceChildren();
            container.appendChild(el('h3', 'roster-title', 'Final results'));
            if (!results.length) { container.appendChild(el('p', 'lb-empty', 'Results not posted yet.')); return; }
            const table = el('table', 'lb-table');
            const thead = el('thead'); const htr = el('tr');
            ['Pos', 'Player', 'Total', 'To Par', 'Scoring'].forEach((h) => htr.appendChild(el('th', null, h)));
            thead.appendChild(htr); table.appendChild(thead);
            const tbody = el('tbody');
            results.forEach((r) => {
                const tr = el('tr');
                tr.appendChild(el('td', 'lb-pos', r.place != null ? String(r.place) : '—'));
                tr.appendChild(el('td', 'lb-name', r.name != null ? String(r.name) : 'Player'));
                tr.appendChild(el('td', null, r.total != null ? String(r.total) : '—'));
                const tp = el('td', 'lb-topar', r.to_par != null ? fmtToPar(r.to_par) : '—');
                if (r.to_par < 0) tp.classList.add('under'); else if (r.to_par > 0) tp.classList.add('over');
                tr.appendChild(tp);
                tr.appendChild(el('td', 'res-chips', fmtBreakdown(r.breakdown)));
                tbody.appendChild(tr);
            });
            table.appendChild(tbody); container.appendChild(table);

            // "Add to UDisc": one tap per player to open the right UDisc course + their hole-by-hole
            // scores to enter (UDisc has no import API). Needs the course's numeric UDisc id and a
            // stored scorecard; otherwise this section is simply omitted.
            const course = courseIndex.get(String(courseId));
            const udiscCourseId = course && course.udisc_course_id;
            const addable = results.filter((r) => r && r.scorecard);
            if (udiscCourseId && addable.length && window.UDiscExport) {
                const sec = el('div', 'udisc-export-section');
                sec.appendChild(el('h4', 'roster-title', 'Add your round to UDisc'));
                addable.forEach((r) => {
                    const node = window.UDiscExport.build({ courseId: udiscCourseId, scorecard: r.scorecard, label: r.name || 'Player' });
                    if (node) sec.appendChild(node);
                });
                container.appendChild(sec);
            }
        }

        // ---- CTPs + ace pot (Track G G3, public on the event detail) ----
        async function renderEventExtras(eventId, card) {
            let ctps = [], pot = null;
            const [cd, pd] = await Promise.all([
                fetchJson(`/events/${encodeURIComponent(eventId)}/ctps`).catch(() => null),
                fetchJson(`/events/${encodeURIComponent(eventId)}/ace-pot`).catch(() => null),
            ]);
            ctps = (cd && cd.ctps) || [];
            pot = pd && pd.ace_pot;
            if (ctps.length) {
                card.appendChild(el('h3', 'roster-title', 'CTPs (closest to pin)'));
                const ul = el('ul', 'extras-list');
                ctps.forEach((c) => ul.appendChild(el('li', null, 'Hole ' + c.hole + (c.division ? ' (' + c.division + ')' : '') + (c.prize ? ' — ' + c.prize : '') + (c.winner_name ? ' · 🏆 ' + c.winner_name : ''))));
                card.appendChild(ul);
            }
            if (pot && (pot.total_cents > 0 || (pot.status && pot.status !== 'active'))) {
                card.appendChild(el('h3', 'roster-title', 'Ace pot'));
                const money = (c) => '$' + ((c || 0) / 100).toLocaleString();
                let txt;
                if (pot.status === 'paid_out') txt = 'Paid out' + (pot.winner_name ? ' to ' + pot.winner_name + ' 🏆' : '');
                else if (pot.status === 'carried') txt = money(pot.total_cents) + ' carried to the next event';
                else txt = money(pot.total_cents) + ' in the pot' + (pot.contributors ? ' (' + pot.contributors + ' in)' : '');
                card.appendChild(el('p', 'detail-notes', txt));
            }
        }

        // T4: per-hole tee signs for the event's selected layout. Viewer is public → official photos only;
        // holes without a photo fall back to the SVG tee sign rendered from the confirmed layout data.
        async function renderTeeSigns(ev, card) {
            if (!ev.course_id) return;
            const [ld, td] = await Promise.all([
                fetchJson(`/courses/${encodeURIComponent(ev.course_id)}/layouts`).catch(() => null),
                fetchJson(`/courses/${encodeURIComponent(ev.course_id)}/tee-signs`).catch(() => null),
            ]);
            const layouts = (ld && ld.layouts) || [];
            const signs = (td && td.teeSigns) || [];
            const layout = layouts.find((l) => String(l.id) === ev.layout_id) || layouts[0] || null;
            let holes = [];
            if (layout) { try { holes = JSON.parse(layout.holes || '[]'); } catch (_e) { holes = []; } }
            const officialByHole = new Map();
            signs.forEach((s) => { if (s.status === 'official') officialByHole.set(Number(s.hole_number), s.id); });
            const holeData = new Map(holes.map((h) => [Number(h.hole), h]));
            const holeNums = new Set([...holeData.keys(), ...officialByHole.keys()]);
            if (!holeNums.size) return; // nothing confirmed yet → no section (capture CTA lives on the members page)
            card.appendChild(el('h3', 'roster-title', '🪧 Tee Signs' + (layout ? ' — ' + layout.name : '')));
            const grid = el('div', 'tee-signs-grid');
            const courseName = courseNameFor(courseIndex, ev.course_id) || '';
            for (const hn of [...holeNums].sort((a, b) => a - b)) {
                const h = holeData.get(hn) || { hole: hn };
                const holeCard = el('div', 'ts-hole-card');
                const signId = officialByHole.get(hn);
                if (signId != null) {
                    const img = el('img', 'ts-hole-photo');
                    img.loading = 'lazy';
                    img.alt = `Tee sign, hole ${hn}`;
                    img.src = `${API_BASE}/tee-signs/${encodeURIComponent(signId)}/image`;
                    holeCard.appendChild(img);
                } else {
                    const wrap = el('div', 'ts-hole-svg');
                    const node = teeSignNode({ hole: hn, courseName, layouts: [{ label: layout ? layout.name : 'Layout', color: h.color || (h.tee && h.tee.color) || null, par: h.par != null ? h.par : null, distance_ft: h.distance_ft != null ? h.distance_ft : null }] });
                    if (node) wrap.appendChild(node);
                    holeCard.appendChild(wrap);
                }
                const meta = el('div', 'ts-hole-meta');
                meta.appendChild(el('span', 'ts-hole-num', 'Hole ' + hn));
                const bits = [];
                if (h.par != null) bits.push('Par ' + h.par);
                if (h.distance_ft != null) bits.push(h.distance_ft + ' ft');
                if (bits.length) meta.appendChild(document.createTextNode(' · ' + bits.join(' · ')));
                holeCard.appendChild(meta);
                grid.appendChild(holeCard);
            }
            card.appendChild(grid);
        }

        function renderDetail(rawEvent) {
            const ev = normalizeEvent(rawEvent);
            detailEl.replaceChildren();

            const backBtn = el('button', 'back-link', '← All events');
            backBtn.type = 'button';
            backBtn.addEventListener('click', () => { window.location.hash = ''; });
            detailEl.appendChild(backBtn);

            const card = el('div', 'detail-card');

            const head = el('div', 'detail-head');
            head.appendChild(el('h2', 'detail-title', ev.name));
            if (ev.type) head.appendChild(badge(typeLabel(ev.type), 'type-badge ' + ev.type));
            if (ev.status) head.appendChild(badge(statusLabel(ev.status), 'status-badge ' + ev.status));
            card.appendChild(head);

            // Live scoring: real-time leaderboard over WebSocket (polling fallback).
            if (ev.status === 'live') {
                const banner = el('div', 'live-banner');
                banner.appendChild(el('span', 'live-dot'));
                banner.appendChild(el('span', null, 'Live scoring in progress'));
                const conn = el('span', 'lb-conn', 'connecting…');
                banner.appendChild(conn);
                card.appendChild(banner);
                const weather = el('div', 'live-weather');
                weather.hidden = true;
                card.appendChild(weather);
                // Players keep their own card's scores in the mobile scorecard app (score.html). Members use
                // their saved login; a guest registrant passes their registration token so they can score too.
                const ks = el('a', 'btn-keep-score', '✏️ Keep score for my card');
                let href = 'score.html?event=' + encodeURIComponent(ev.id);
                const gr = (typeof guestRegs === 'function' ? guestRegs()[ev.id] : null);
                if (!memberToken() && gr && gr.guestToken) href += '&gt=' + encodeURIComponent(gr.guestToken);
                ks.href = href;
                card.appendChild(ks);
                const lb = el('div', 'lb-wrap');
                card.appendChild(lb);
                mountLiveLeaderboard(ev.id, lb, conn, weather);
            } else if (ev.status === 'final') {
                const rwrap = el('div', 'lb-wrap');
                card.appendChild(rwrap);
                renderFinalResults(ev.id, rwrap, ev.course_id);
            }

            const facts = el('div', 'detail-facts');
            facts.appendChild(fact('Date', formatEventDate(ev.date)));
            if (ev.format || ev.play_format) {
                const play = ev.play_format === 'doubles' || ev.format === 'doubles' ? 'Doubles' : ev.play_format === 'teams' ? 'Teams' : 'Singles';
                const scoring = ev.format === 'matchplay' ? 'Matchplay' : 'Stroke play';
                facts.appendChild(fact('Format', play + ' · ' + scoring));
            }

            const courseName = courseNameFor(courseIndex, ev.course_id);
            const course = courseIndex.get(String(ev.course_id));
            if (courseName) {
                const udiscLink = course && sanitizeUrl(course.udisc_url);
                if (udiscLink) {
                    const wrap = el('span');
                    wrap.appendChild(el('span', null, courseName + ' '));
                    wrap.appendChild(safeLink(course.udisc_url, '(UDisc ↗)'));
                    facts.appendChild(fact('Course', wrap));
                } else {
                    facts.appendChild(fact('Course', courseName));
                }
            }
            if (ev.external_url && sanitizeUrl(ev.external_url)) {
                facts.appendChild(fact('More info', safeLink(ev.external_url, 'External link ↗')));
            }
            card.appendChild(facts);

            if (ev.notes) {
                card.appendChild(el('div', 'detail-notes', ev.notes));
            }

            // Roster, grouped by division when present.
            const grouped = groupPlayersByDivision(ev.players);
            if (grouped.length) {
                card.appendChild(el('h3', 'roster-title', `Players (${ev.players.length})`));
                // If everyone is in the single synthetic 'Open' group, skip the heading.
                const showDivisionHeads = !(grouped.length === 1 && grouped[0].division === 'Open');
                for (const group of grouped) {
                    const groupWrap = el('div', 'division-group');
                    if (showDivisionHeads) groupWrap.appendChild(el('div', 'division-name', group.division));
                    const listEl = el('div', 'player-list');
                    for (const p of group.players) {
                        const row = el('div', 'player-row');
                        row.appendChild(el('span', 'player-name', p && p.name != null ? String(p.name) : 'Unnamed'));
                        if (p && p.pdga_no) row.appendChild(el('span', 'player-pdga', '#' + p.pdga_no));
                        if (p && p.team) row.appendChild(el('span', 'player-team', String(p.team)));
                        listEl.appendChild(row);
                    }
                    groupWrap.appendChild(listEl);
                    card.appendChild(groupWrap);
                }
            }

            renderEventExtras(ev.id, card); // CTPs + ace pot (Track G G3), filled in async
            renderTeeSigns(ev, card);       // T4: per-hole tee signs (official photo / SVG fallback), filled in async

            detailEl.appendChild(card);
            setView('detail');
            lastUpdatedEl.hidden = true;
            window.scrollTo(0, 0);
        }

        async function loadDetail(id) {
            teardownLive(); // close any prior live socket before re-rendering
            showStatus('Loading event…', false);
            try {
                await ensureCourses(); // for course name + UDisc link
                const data = await fetchJson(`/events/${encodeURIComponent(id)}`);
                if (!data || !data.event) {
                    showStatus('That event could not be found.', true, () => { window.location.hash = ''; });
                    return;
                }
                renderDetail(data.event);
            } catch (_err) {
                showStatus('We couldn’t load that event right now. Please try again.', true, () => loadDetail(id));
            }
        }

        // ---------- ROUTING ----------
        // Hash route: "#event/:id" -> event detail; "#league/:id" -> league standings; else hub.
        function parseHash() {
            const h = window.location.hash || '';
            let m = h.match(/^#event\/(.+)$/); if (m) return { view: 'event', id: decodeURIComponent(m[1]) };
            m = h.match(/^#league\/(.+)$/); if (m) return { view: 'league', id: decodeURIComponent(m[1]) };
            m = h.match(/^#manage=(\d+)-([a-f0-9]+)$/i); if (m) return { view: 'manage', id: m[1], token: m[2] };
            return null;
        }

        // A guest's emailed manage link (#manage=<eventId>-<token>): re-seed this browser from the token so
        // the Register section shows their sign-up here (with Withdraw), then drop the token from the URL.
        async function applyManage(eid, token) {
            try {
                const r = await regApi('/events/' + eid + '/registration?gt=' + encodeURIComponent(token));
                if (r.ok) { const d = await r.json(); if (d && d.registration) setGuestReg(eid, { guestToken: token, name: d.registration.name }); }
            } catch (_e) {}
            history.replaceState(null, '', location.pathname + location.search);
            loadHub(); startRefresh();
        }

        function route() {
            stopRefresh();
            const r = parseHash();
            if (r && r.view === 'event') loadDetail(r.id);
            else if (r && r.view === 'league') loadLeague(r.id);
            else if (r && r.view === 'manage') applyManage(r.id, r.token);
            else { loadHub(); startRefresh(); }
        }

        // Quiet ~60s background refresh while on the hub. Keeps current content
        // on screen and only swaps it in once the new payload parses cleanly.
        function startRefresh() {
            stopRefresh();
            refreshTimer = setInterval(async () => {
                if (!hubEl.hidden) {
                    try {
                        const [feed, d1] = await Promise.all([
                            fetchJson('/club-feed').catch(() => ({ events: [], clubEvents: [] })),
                            fetchJson('/events').catch(() => ({ events: [] })),
                        ]);
                        renderPage(feed, (d1 && d1.events) || []);
                        loadRegistration();
                        loadCasualRounds();
                    } catch (_e) {
                        // Silent on background refresh; visible content stays put.
                    }
                }
            }, REFRESH_MS);
        }
        function stopRefresh() {
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        }

        window.addEventListener('hashchange', route);
        route();
    </script>
    <script src="crotts.js" defer></script>
</body>
