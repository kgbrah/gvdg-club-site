<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Greenville Disc Golf Club</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #F7B801;
            --dark: #1A1A2E;
            --light: #F4F4F9;
            --green: #2D5016;
            --bg-primary: #F4F4F9;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F4F4F9;
            --text-primary: #1A1A2E;
            --text-secondary: #333333;
            --text-tertiary: #555555;
            --text-muted: #666666;
            --border-color: #F4F4F9;
            --card-shadow: rgba(0, 0, 0, 0.1);
            --card-shadow-hover: rgba(0, 0, 0, 0.15);
        }
        [data-theme="dark"] {
            --bg-primary: #0F0F1E;
            --bg-secondary: #1A1A2E;
            --bg-tertiary: #252538;
            --text-primary: #F4F4F9;
            --text-secondary: #E0E0E0;
            --text-tertiary: #C0C0C0;
            --text-muted: #A0A0A0;
            --border-color: #2A2A3E;
            --card-shadow: rgba(0, 0, 0, 0.3);
            --card-shadow-hover: rgba(0, 0, 0, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, rgba(244,244,249,0.25), rgba(244,244,249,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover; opacity: 1;
        }
        [data-theme="dark"] body::before {
            background: linear-gradient(to bottom, rgba(15,15,30,0.25), rgba(15,15,30,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover;
        }

        /* ---- Header / nav (mirrors index.html) ---- */
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); padding: 1rem 1.5rem; transition: all 0.3s ease; }
        [data-theme="dark"] header { background: rgba(15, 15, 30, 0.95); }
        header.scrolled { box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2); padding: 0.75rem 1.5rem; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: white; letter-spacing: 0.05em; text-decoration: none; transition: transform 0.3s ease; display: flex; align-items: center; }
        .logo-image { height: 50px; width: auto; transition: transform 0.3s ease; }
        header.scrolled .logo-image { height: 40px; }
        .logo:active { transform: scale(0.95); }
        .logo:hover .logo-image { transform: scale(1.05); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .theme-toggle { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); color: white; width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; backdrop-filter: blur(5px); -webkit-tap-highlight-color: transparent; }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.2); transform: rotate(20deg) scale(1.1); }
        .theme-toggle:active { transform: rotate(20deg) scale(0.95); }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; position: relative; transition: color 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-links a:hover::after, .nav-links a:active::after { width: 100%; }
        .nav-links a:hover { color: var(--primary); }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; min-width: 44px; min-height: 44px; -webkit-tap-highlight-color: transparent; transition: transform 0.2s ease; }
        .menu-toggle:active { transform: scale(0.9); }
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .logo-image { height: 40px; }
            header.scrolled .logo-image { height: 35px; }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .nav-right { gap: 1rem; }
            .nav-links { position: fixed; top: 70px; left: 0; right: 0; background: rgba(26, 26, 46, 0.98); flex-direction: column; gap: 0; padding: 2rem; transform: translateY(-100%); opacity: 0; transition: all 0.3s ease; pointer-events: none; max-height: calc(100vh - 70px); overflow-y: auto; }
            [data-theme="dark"] .nav-links { background: rgba(15, 15, 30, 0.98); }
            .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links li { padding: 1.25rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .nav-links li:last-child { border-bottom: none; }
            .nav-links a { font-size: 1.1rem; display: block; padding: 0.5rem 0; }
        }

        /* ---- Page body ---- */
        main { padding-top: 110px; max-width: 1200px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; padding-bottom: 4rem; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 7vw, 4rem); text-align: center; letter-spacing: 0.05em; color: var(--text-primary); margin: 1rem 0 0.25rem; }
        .page-subtitle { text-align: center; color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        /* ---- Event sections ---- */
        .events-section { margin-bottom: 2.75rem; }
        .events-section-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--border-color); }
        .events-section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: 0.04em; color: var(--text-primary); }
        .events-section.live .events-section-title { color: var(--primary); }
        .events-section-count { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        .live-dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--primary); display: inline-block; box-shadow: 0 0 0 0 rgba(255,107,53,0.6); animation: pulse 1.8s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,53,0.6); } 70% { box-shadow: 0 0 0 10px rgba(255,107,53,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); } }

        .events-grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        @media (max-width: 560px) { .events-grid { grid-template-columns: 1fr; } }

        .event-card { background: var(--bg-secondary); border-radius: 15px; overflow: hidden; border: 2px solid var(--border-color); transition: all 0.3s ease; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: flex; flex-direction: column; padding: 1.4rem; gap: 0.7rem; box-shadow: 0 6px 24px var(--card-shadow); }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px var(--card-shadow-hover); border-color: var(--primary); }
        .event-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .event-card.live { border-color: var(--primary); box-shadow: 0 8px 30px rgba(255, 107, 53, 0.25); }
        .event-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
        .event-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.45rem; line-height: 1.1; color: var(--text-primary); letter-spacing: 0.02em; }
        .event-meta { font-size: 0.9rem; color: var(--text-tertiary); display: flex; flex-direction: column; gap: 0.3rem; }
        .event-meta .meta-row { display: flex; align-items: center; gap: 0.4rem; }
        .event-meta .meta-icon { opacity: 0.8; }

        /* ---- Badges ---- */
        .badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
        .type-badge { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        [data-theme="dark"] .type-badge { background: var(--bg-primary); }
        .type-badge.tournament { background: linear-gradient(135deg, var(--primary), #cc4a1a); color: white; border: none; }
        .type-badge.league_round { background: linear-gradient(135deg, var(--secondary), var(--green)); color: white; border: none; }
        .type-badge.fundraiser { background: linear-gradient(135deg, var(--accent), #e5a600); color: var(--dark); border: none; }
        .type-badge.meeting { background: var(--bg-tertiary); color: var(--text-secondary); }
        .status-badge { font-size: 0.68rem; }
        .status-badge.live { background: var(--primary); color: white; }
        .status-badge.scheduled { background: rgba(0, 78, 137, 0.15); color: var(--secondary); }
        [data-theme="dark"] .status-badge.scheduled { background: rgba(47, 127, 196, 0.25); color: #7fb3e0; }
        .status-badge.final { background: var(--bg-tertiary); color: var(--text-muted); border: 1px solid var(--border-color); }
        .status-badge.cancelled { background: rgba(200, 16, 46, 0.15); color: #c8102e; text-decoration: line-through; }
        [data-theme="dark"] .status-badge.cancelled { color: #e63950; }

        /* ---- Detail view ---- */
        .detail-card { background: var(--bg-secondary); border-radius: 18px; padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: 0 10px 40px var(--card-shadow); border: 1px solid rgba(0, 78, 137, 0.08); margin-bottom: 1.5rem; }
        [data-theme="dark"] .detail-card { border-color: rgba(255, 255, 255, 0.05); }
        .detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
        .detail-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: 0.03em; color: var(--text-primary); flex: 1 1 100%; }
        .detail-facts { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 1.5rem 0; }
        .detail-fact { background: var(--bg-tertiary); border-radius: 12px; padding: 1rem; }
        [data-theme="dark"] .detail-fact { background: var(--bg-primary); }
        .detail-fact .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
        .detail-fact .value { font-size: 1rem; color: var(--text-secondary); font-weight: 600; word-break: break-word; }
        .detail-fact .value a { color: var(--primary); text-decoration: none; }
        .detail-fact .value a:hover { text-decoration: underline; }
        .detail-notes { background: var(--bg-tertiary); border-left: 4px solid var(--accent); border-radius: 8px; padding: 1rem 1.25rem; margin: 1.25rem 0; color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap; }
        [data-theme="dark"] .detail-notes { background: var(--bg-primary); }
        .live-banner { display: flex; align-items: center; gap: 0.6rem; background: linear-gradient(135deg, var(--primary), #cc4a1a); color: white; border-radius: 12px; padding: 1rem 1.25rem; margin: 1.25rem 0; font-weight: 700; }
        .live-banner .leaderboard-link { margin-left: auto; color: white; text-decoration: underline; font-size: 0.9rem; font-weight: 600; }
        .lb-conn { margin-left: auto; font-size: 0.78rem; font-weight: 700; opacity: 0.9; }
        .lb-wrap { margin: 0.25rem 0 1.25rem; }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .lb-table th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 0.4rem 0.6rem; border-bottom: 2px solid var(--border-color); }
        .lb-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); }
        .lb-table tbody tr:first-child td { font-weight: 700; color: var(--text-primary); }
        .lb-pos { width: 2.5rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .lb-name { font-weight: 600; color: var(--text-primary); }
        .lb-topar { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
        .lb-topar.under { color: #2e9e44; }
        .lb-topar.over { color: var(--primary); }
        .lb-empty { color: var(--text-muted); padding: 0.75rem 0; font-style: italic; }
        .res-chips { font-size: 0.8rem; color: var(--text-muted); }
        .extras-list { margin: 0.25rem 0 1rem 1.25rem; color: var(--text-secondary); line-height: 1.7; }
        #leaguesSection { margin-bottom: 1.5rem; }
        .leagues-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 0.75rem; }
        .league-card { text-align: left; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.25rem; transition: border-color .15s, transform .15s; font: inherit; }
        .league-card:hover { border-color: var(--secondary); transform: translateY(-2px); }
        .league-name { font-weight: 700; color: var(--text-primary); }
        .league-meta { font-size: 0.8rem; color: var(--text-muted); }
        #fundraisersSection { margin-bottom: 1.5rem; }
        .fundraiser-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.25rem 1.5rem; margin-top: 0.75rem; }
        .fundraiser-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.03em; color: var(--text-primary); margin-bottom: 0.5rem; }
        .fr-bar { height: 12px; background: var(--bg-tertiary); border-radius: 999px; overflow: hidden; margin: 0.25rem 0; }
        .fr-bar-fill { height: 100%; background: linear-gradient(90deg, #2e9e44, #25c05a); border-radius: 999px; }
        .fr-progress { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .fundraiser-body { color: var(--text-secondary); line-height: 1.6; }
        .fundraiser-body p { margin: 0.5rem 0; } .fundraiser-body ul { margin: 0.5rem 0 0.5rem 1.25rem; }
        .donate-btn { display: inline-block; margin-top: 0.75rem; background: #2e9e44; color: #fff; padding: 0.6rem 1.25rem; border-radius: 10px; font-weight: 700; text-decoration: none; }
        .donate-btn:hover { background: #25883a; }
        .fr-share { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.85rem; }
        .fr-share-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .fr-share-btn { font: inherit; font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-secondary); text-decoration: none; cursor: pointer; }
        .fr-share-btn:hover { border-color: var(--secondary); color: var(--text-primary); }
        .fr-share-btn.fb { color: #1877f2; } .fr-share-btn.tw { color: var(--text-primary); }
        @keyframes lbflash { from { background: rgba(255,107,53,0.18); } to { background: transparent; } }
        .lb-table tbody tr.lb-upd td { animation: lbflash 0.9s ease-out; }

        .roster-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.03em; color: var(--text-primary); margin: 1.75rem 0 1rem; }
        .division-group { margin-bottom: 1.5rem; }
        .division-name { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary); font-weight: 700; margin-bottom: 0.6rem; }
        .player-list { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        .player-row { background: var(--bg-tertiary); border-radius: 10px; padding: 0.65rem 0.85rem; display: flex; align-items: baseline; gap: 0.5rem; border: 1px solid var(--border-color); }
        [data-theme="dark"] .player-row { background: var(--bg-primary); }
        .player-name { font-weight: 600; color: var(--text-secondary); }
        .player-pdga { font-size: 0.78rem; color: var(--text-muted); }
        .player-team { margin-left: auto; font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

        /* ---- States ---- */
        .status-box { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); }
        .status-box .spinner { width: 42px; height: 42px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 1rem; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-box.error { color: #c8102e; }
        [data-theme="dark"] .status-box.error { color: #e63950; }
        .status-box .empty-icon { font-size: 2.5rem; opacity: 0.6; margin-bottom: 0.5rem; }
        .retry-btn { margin-top: 1rem; background: var(--primary); color: white; border: none; padding: 0.75rem 1.75rem; min-height: 44px; border-radius: 50px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.3s ease; }
        .retry-btn:hover { background: #ff7f4d; transform: translateY(-2px); }
        .last-updated { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 1.5rem; }
        .back-link { display: inline-block; margin-top: 0.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.95rem; background: none; border: none; cursor: pointer; font: inherit; }
        .back-link:hover { color: var(--primary); }

        /* ---- Footer (mirrors index.html) ---- */
        footer { background: linear-gradient(135deg, var(--dark) 0%, #0d1a0d 100%); color: white; text-align: center; padding: 2.5rem 2rem; font-size: 0.95rem; border-top: 3px solid var(--accent); }
        [data-theme="dark"] footer { background: linear-gradient(135deg, var(--bg-secondary) 0%, #0a0a14 100%); }
        @media print { header, footer { display: none; } }
    </style>
</head>
<body data-api-base="https://auth.greenvillediscgolf.com">
    <header>
    <nav>
        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="Greenville DGC Logo" class="logo-image">
        </a>
        <ul class="nav-links">
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#courses">Courses</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="gvdg-blog.html">Blog</a></li>
            <li><a href="gvdg-members.html">Members</a></li>
            <li><a href="ryder-cup.html">Ryder Cup</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
       <div class="nav-right">
            <button class="menu-toggle" aria-label="Toggle menu">☰</button>
            <button class="theme-toggle" aria-label="Toggle dark mode">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </nav>
</header>

    <main>
        <h1 class="page-title">Events</h1>
        <p class="page-subtitle">Tournaments, league rounds &amp; club happenings</p>

        <!-- Loading / error / content -->
        <div id="status" class="status-box">
            <div class="spinner"></div>
            <div>Loading events&hellip;</div>
        </div>

        <!-- Fundraisers + Leagues & standings (shown with the hub) -->
        <div id="fundraisersSection" hidden></div>
        <div id="leaguesSection" hidden></div>

        <!-- Hub view (live / upcoming / past sections) -->
        <div id="hub" hidden></div>

        <!-- Detail view (single event) -->
        <div id="detail" hidden></div>

        <p id="lastUpdated" class="last-updated" hidden></p>
        <div style="text-align:center;">
            <a href="index.html" class="back-link">&larr; Back to home</a>
        </div>
    </main>

    <footer><p>&copy; 2026 Greenville Disc Golf Club. All rights reserved. | Greenville, NC</p></footer>

    <script type="module">
        import {
            bucketEvents,
            normalizeEvent,
            groupPlayersByDivision,
            buildCourseIndex,
            courseNameFor,
            formatEventDate,
            typeLabel,
            statusLabel,
        } from './events.js';

        // --- Theme toggle (mirrors index.html) ---
        const themeToggle = document.querySelector('.theme-toggle');
        const themeIcon = document.querySelector('.theme-icon');
        const html = document.documentElement;
        const currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        themeIcon.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        themeToggle.addEventListener('click', () => {
            const t = html.getAttribute('data-theme');
            const n = t === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', n);
            localStorage.setItem('theme', n);
            themeIcon.textContent = n === 'dark' ? '☀️' : '🌙';
        });

        // --- Mobile menu (mirrors index.html) ---
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');
        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuToggle.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
        });
        document.querySelectorAll('.nav-links a').forEach((l) =>
            l.addEventListener('click', () => {
                navLinks.classList.remove('active');
                menuToggle.textContent = '☰';
            })
        );

        // --- Scrolled header shadow (mirrors index.html) ---
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            window.scrollY > 100 ? header.classList.add('scrolled') : header.classList.remove('scrolled');
        });

        // --- API wiring ---
        // Public read endpoints on the club Worker. Base is configurable on <body>
        // so the senior engineer can repoint it at a local Worker for testing.
        const API_BASE = (document.body.dataset.apiBase || 'https://auth.greenvillediscgolf.com')
            .trim()
            .replace(/\/+$/, ''); // strip trailing slashes
        const REFRESH_MS = 60 * 1000; // ~60s background refresh on the hub

        const statusEl = document.getElementById('status');
        const hubEl = document.getElementById('hub');
        const leaguesEl = document.getElementById('leaguesSection');
        const fundraisersEl = document.getElementById('fundraisersSection');
        const detailEl = document.getElementById('detail');
        const lastUpdatedEl = document.getElementById('lastUpdated');

        // In-memory caches so navigating hub <-> detail doesn't refetch needlessly.
        let courseIndex = new Map();
        let coursesLoaded = false;
        let refreshTimer = null;

        // --- XSS-safe DOM helper (mirrors ryder-cup.html) ---
        // Every piece of API data lands here as a text node; we NEVER assign
        // innerHTML with API data anywhere in this file.
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        // Build a safe external anchor. href is sanitized to http(s) only so a
        // hostile external_url/udisc_url can't inject a javascript: URL.
        function safeLink(href, text) {
            const a = el('a', null, text);
            const clean = sanitizeUrl(href);
            if (clean) {
                a.href = clean;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
            }
            return a;
        }
        function sanitizeUrl(raw) {
            if (!raw) return '';
            try {
                const u = new URL(String(raw), window.location.href);
                return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
            } catch (_e) {
                return '';
            }
        }

        function setView(which) {
            statusEl.hidden = which !== 'status';
            hubEl.hidden = which !== 'hub';
            leaguesEl.hidden = which !== 'hub';
            fundraisersEl.hidden = which !== 'hub';
            detailEl.hidden = which !== 'detail';
        }

        function showStatus(message, isError, onRetry) {
            setView('status');
            statusEl.className = 'status-box' + (isError ? ' error' : '');
            statusEl.replaceChildren();
            if (isError) {
                statusEl.appendChild(el('div', null, message));
                const btn = el('button', 'retry-btn', 'Retry');
                btn.type = 'button';
                btn.addEventListener('click', onRetry || route);
                statusEl.appendChild(btn);
            } else {
                statusEl.appendChild(el('div', 'spinner'));
                statusEl.appendChild(el('div', null, message));
            }
        }

        function showEmpty(message) {
            setView('status');
            statusEl.className = 'status-box';
            statusEl.replaceChildren();
            statusEl.appendChild(el('div', 'empty-icon', '🥏'));
            statusEl.appendChild(el('div', null, message));
        }

        async function fetchJson(path) {
            const res = await fetch(`${API_BASE}${path}`, {
                cache: 'no-store',
                headers: { Accept: 'application/json' },
            });
            if (!res.ok) throw new Error(`Request failed (${res.status})`);
            return res.json();
        }

        // Lazily load /courses once so cards/detail can show a course name.
        async function ensureCourses() {
            if (coursesLoaded) return;
            try {
                const data = await fetchJson('/courses');
                courseIndex = buildCourseIndex(data && data.courses);
            } catch (_e) {
                // Course names are a nicety — never block events on this.
                courseIndex = new Map();
            }
            coursesLoaded = true;
        }

        // ---------- HUB ----------
        function badge(text, classes) {
            const b = el('span', 'badge ' + classes, text);
            return b;
        }

        function eventCard(ev) {
            // Use a <button> so the card is keyboard-focusable + screen-reader friendly.
            const card = el('button', 'event-card' + (ev.status === 'live' ? ' live' : ''));
            card.type = 'button';
            card.addEventListener('click', () => {

            });

            const top = el('div', 'event-card-top');

            const meta = el('div', 'event-meta');
            const dateRow = el('div', 'meta-row');
            dateRow.appendChild(el('span', 'meta-icon', '📅'));

            const courseName = courseNameFor(courseIndex, ev.course_id);

        function section(title, events, opts = {}) {
            const wrap = el('section', 'events-section' + (opts.live ? ' live' : ''));
            const head = el('div', 'events-section-head');
            if (opts.live) head.appendChild(el('span', 'live-dot'));

        function renderHub(rawEvents) {
            const { live, upcoming, past } = bucketEvents(rawEvents);

            if (!live.length && !upcoming.length && !past.length) {
                showEmpty('No events posted yet — check back soon!');
                return;

            if (live.length) hubEl.appendChild(section('Live Now', live, { live: true }));

        async function loadHub() {
            teardownLive(); // close any live socket from a detail view
            showStatus('Loading events…', false);
            try {
                // Courses first (best-effort) so cards can show names on first paint.
                await ensureCourses();
                const data = await fetchJson('/events');
                renderHub(data && data.events);
                loadLeaguesList(); // best-effort; standings live behind each league
                loadFundraisers();
            } catch (_err) {
                hubEl.replaceChildren();
                lastUpdatedEl.hidden = true;
                showStatus('We couldn’t load events right now. Please try again.', true, loadHub);
            }
        }

        // ---------- Safe markdown (XSS-safe: textContent + createElement only; http(s) links only) ----------
        function appendInline(parent, text) {
            const re = /\*\*([^*]+)\*\*|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
            let last = 0, m;
            while ((m = re.exec(text)) !== null) {
                if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
                if (m[1] != null) { const s = document.createElement('strong'); s.textContent = m[1]; parent.appendChild(s); }
                else { const a = document.createElement('a'); a.href = m[3]; a.textContent = m[2]; a.target = '_blank'; a.rel = 'noopener noreferrer'; parent.appendChild(a); }
                last = re.lastIndex;
            }
            if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
        }
        function safeMd(md, container) {
            container.replaceChildren();
            String(md || '').split(/\n\s*\n/).forEach((block) => {
                const lines = block.split('\n').filter((l) => l.trim() !== '');
                if (!lines.length) return;
                if (lines.every((l) => /^\s*-\s+/.test(l))) {
                    const ul = document.createElement('ul');
                    lines.forEach((l) => { const li = document.createElement('li'); appendInline(li, l.replace(/^\s*-\s+/, '')); ul.appendChild(li); });
                    container.appendChild(ul);
                } else if (/^#{1,3}\s+/.test(lines[0])) {
                    const h = document.createElement('h4'); appendInline(h, lines[0].replace(/^#{1,3}\s+/, '')); container.appendChild(h);
                    if (lines.length > 1) { const p = document.createElement('p'); appendInline(p, lines.slice(1).join('\n')); container.appendChild(p); }
                } else {
                    const p = document.createElement('p');
                    lines.forEach((l, i) => { if (i) p.appendChild(document.createElement('br')); appendInline(p, l); });
                    container.appendChild(p);
                }
            });
        }

        // Social share buttons -> the donation page. URLs are app-controlled with encodeURIComponent'd
        // params (no injection); links open in a new tab. Copy uses the clipboard API.
        function shareRow(donateUrl, title) {
            const wrap = el('div', 'fr-share');
            wrap.appendChild(el('span', 'fr-share-label', 'Share:'));
            const eu = encodeURIComponent(donateUrl);
            const et = encodeURIComponent(`Support ${title} — Greenville Disc Golf Club`);
            const mk = (cls, label, href, newTab) => {
                const a = el('a', 'fr-share-btn ' + cls, label);
                a.href = href; a.rel = 'noopener noreferrer'; if (newTab) a.target = '_blank';
                return a;
            };
            wrap.appendChild(mk('fb', 'Facebook', `https://www.facebook.com/sharer/sharer.php?u=${eu}`, true));
            wrap.appendChild(mk('tw', 'X', `https://twitter.com/intent/tweet?url=${eu}&text=${et}`, true));
            wrap.appendChild(mk('em', 'Email', `mailto:?subject=${et}&body=${et}%0A%0A${eu}`, false));
            const copy = el('button', 'fr-share-btn copy', 'Copy link'); copy.type = 'button';
            copy.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(donateUrl); copy.textContent = 'Copied!'; }
                catch (_e) { copy.textContent = 'Copy failed'; }
                setTimeout(() => { copy.textContent = 'Copy link'; }, 1600);
            });
            wrap.appendChild(copy);
            return wrap;
        }

        // ---------- FUNDRAISERS (Phase 4, public) ----------
        async function loadFundraisers() {
            let items = [];
            try { const d = await fetchJson('/fundraisers'); items = (d && d.fundraisers) || []; } catch (_e) {}
            const active = items.filter((f) => f.status === 'active');
            fundraisersEl.replaceChildren();
            if (!active.length) return;
            fundraisersEl.appendChild(el('h2', 'events-section-title', 'Fundraisers'));
            active.forEach((f) => {
                const card = el('div', 'fundraiser-card');
                card.appendChild(el('h3', 'fundraiser-title', f.title));
                if (f.goal_cents) {
                    const pct = Math.max(0, Math.min(100, Math.round(((f.raised_cents || 0) / f.goal_cents) * 100)));
                    const bar = el('div', 'fr-bar'); const fill = el('div', 'fr-bar-fill'); fill.style.width = pct + '%'; bar.appendChild(fill);
                    card.appendChild(bar);
                    card.appendChild(el('div', 'fr-progress', '$' + ((f.raised_cents || 0) / 100).toLocaleString() + ' of $' + (f.goal_cents / 100).toLocaleString() + ' (' + pct + '%)'));
                }
                if (f.body_md) { const body = el('div', 'fundraiser-body'); safeMd(f.body_md, body); card.appendChild(body); }
                const url = sanitizeUrl(f.paypal_url) ? f.paypal_url : 'https://paypal.me/greenvillediscgolf';

        // ---------- LEAGUES & STANDINGS (Phase 4) ----------
        async function loadLeaguesList() {
            let leagues = [];
            try { const d = await fetchJson('/leagues'); leagues = (d && d.leagues) || []; } catch (_e) {}
            leaguesEl.replaceChildren();
            if (!leagues.length) return; // no leagues -> nothing shown
            leaguesEl.appendChild(el('h2', 'events-section-title', 'Leagues & Standings'));
            const wrap = el('div', 'leagues-grid');
            leagues.forEach((l) => {
                const card = el('button', 'league-card');
                card.type = 'button';
                card.appendChild(el('span', 'league-name', l.name));

        async function loadLeague(id) {
            teardownLive();
            showStatus('Loading league…', false);
            try {
                await ensureCourses();
                const data = await fetchJson(`/leagues/${encodeURIComponent(id)}`);
                if (!data || !data.league) { showStatus('That league could not be found.', true, () => { window.location.hash = ''; }); return; }
                renderLeague(data);
            } catch (_e) {

        function renderLeague(data) {
            const lg = data.league, standings = data.standings || [], rounds = data.events || [];
            detailEl.replaceChildren();
            const backBtn = el('button', 'back-link', '← All events');
            backBtn.type = 'button';
            backBtn.addEventListener('click', () => { window.location.hash = ''; });
            detailEl.appendChild(backBtn);

            const card = el('div', 'detail-card');
            const head = el('div', 'detail-head');
            head.appendChild(el('h2', 'detail-title', lg.name));
            const meta = [lg.season, lg.format].filter(Boolean).join(' · ');
            if (meta) head.appendChild(badge(meta, 'type-badge'));
            card.appendChild(head);
            if (lg.description) card.appendChild(el('div', 'detail-notes', lg.description));

            card.appendChild(el('h3', 'roster-title', 'Standings'));
            if (!standings.length) {
                card.appendChild(el('p', 'lb-empty', 'No finalized rounds yet — standings appear once rounds are scored.'));
            } else {
                const table = el('table', 'lb-table');
                const thead = el('thead'); const htr = el('tr');
                ['Pos', 'Player', 'Pts', 'Played', 'Wins', 'To Par'].forEach((h) => htr.appendChild(el('th', null, h)));
                thead.appendChild(htr); table.appendChild(thead);
                const tbody = el('tbody');
                standings.forEach((s, i) => {
                    const tr = el('tr');
                    tr.appendChild(el('td', 'lb-pos', String(i + 1)));
                    tr.appendChild(el('td', 'lb-name', s.name != null ? String(s.name) : 'Player'));
                    tr.appendChild(el('td', null, String(s.points)));
                    tr.appendChild(el('td', null, String(s.events)));
                    tr.appendChild(el('td', null, String(s.wins)));
                    const tp = el('td', 'lb-topar', fmtToPar(s.total_to_par));
                    if (s.total_to_par < 0) tp.classList.add('under'); else if (s.total_to_par > 0) tp.classList.add('over');
                    tr.appendChild(tp);
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody); card.appendChild(table);
            }

            const finals = rounds.filter((r) => r.status === 'final');
            if (rounds.length) {
                card.appendChild(el('h3', 'roster-title', `Rounds (${rounds.length})`));
                const list = el('div', 'player-list');
                rounds.forEach((ev) => {
                    const row = el('button', 'player-row');
                    row.type = 'button';
                    row.style.cursor = 'pointer';
                    row.appendChild(el('span', 'player-name', ev.name));
                    if (ev.date) row.appendChild(el('span', 'player-pdga', ev.date));
                    row.appendChild(el('span', 'player-team', statusLabel(ev.status)));
                    row.addEventListener('click', () => { window.location.hash = `#event/${encodeURIComponent(ev.id)}`; });
                    list.appendChild(row);
                });
                card.appendChild(list);
                void finals;
            }

            detailEl.appendChild(card);
            setView('detail');
            lastUpdatedEl.hidden = true;
            window.scrollTo(0, 0);
        }

        // ---------- DETAIL ----------
        function fact(label, valueNode) {
            const f = el('div', 'detail-fact');
            f.appendChild(el('div', 'label', label));
            const v = el('div', 'value');
            if (typeof valueNode === 'string') v.textContent = valueNode;
            else v.appendChild(valueNode);
            f.appendChild(v);
            return f;
        }

        // ---- Live leaderboard (S3): WebSocket viewer with polling fallback ----
        let activeLive = null;
        function teardownLive() {
            if (!activeLive) return;
            try { if (activeLive.ws) activeLive.ws.close(); } catch (_e) {}
            if (activeLive.poll) clearInterval(activeLive.poll);
            activeLive = null;
        }
        function fmtToPar(n) { n = n || 0; return n === 0 ? 'E' : (n > 0 ? '+' + n : String(n)); }
        function renderStandings(container, snap) {
            const standings = (snap && snap.standings) || [];
            container.replaceChildren();
            if (!standings.length) { container.appendChild(el('p', 'lb-empty', 'Waiting for the first scores…')); return; }
            const table = el('table', 'lb-table');
            const thead = el('thead'); const htr = el('tr');
            ['Pos', 'Player', 'Thru', 'Total', 'To Par'].forEach((h) => htr.appendChild(el('th', null, h)));
            thead.appendChild(htr); table.appendChild(thead);
            const tbody = el('tbody');
            standings.forEach((s, i) => {
                const tr = el('tr');
                tr.appendChild(el('td', 'lb-pos', String(i + 1)));
                tr.appendChild(el('td', 'lb-name', s && s.name != null ? String(s.name) : 'Player'));
                tr.appendChild(el('td', null, s && s.thru ? String(s.thru) : '—'));
                tr.appendChild(el('td', null, s && s.total != null && s.thru ? String(s.total) : '—'));
                const tp = el('td', 'lb-topar', s && s.thru ? fmtToPar(s.toPar) : '—');
                if (s && s.thru) { if ((s.toPar || 0) < 0) tp.classList.add('under'); else if ((s.toPar || 0) > 0) tp.classList.add('over'); }
                tr.appendChild(tp);
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }
        function mountLiveLeaderboard(eventId, container, statusEl) {
            teardownLive();
            const ctx = { ws: null, poll: null, gotWs: false };
            activeLive = ctx;
            const setConn = (t) => { if (statusEl) statusEl.textContent = t; };
            const pollOnce = async () => { try { const d = await fetchJson(`/events/${encodeURIComponent(eventId)}/live`); if (activeLive === ctx) renderStandings(container, d); } catch (_e) {} };
            const startPolling = () => { if (ctx.poll || activeLive !== ctx) return; setConn('live (auto-refresh)'); pollOnce(); ctx.poll = setInterval(pollOnce, 5000); };
            try {
                const wsUrl = API_BASE.replace(/^http/, 'ws') + `/events/${encodeURIComponent(eventId)}/live/ws`;
                const ws = new WebSocket(wsUrl);
                ctx.ws = ws;
                ws.onopen = () => { ctx.gotWs = true; setConn('● live'); };
                ws.onmessage = (e) => { try { if (activeLive === ctx) renderStandings(container, JSON.parse(e.data)); } catch (_e) {} };
                ws.onerror = () => { if (!ctx.gotWs) startPolling(); };
                ws.onclose = () => { if (!ctx.gotWs && activeLive === ctx) startPolling(); };
                setTimeout(() => { if (!ctx.gotWs) startPolling(); }, 4000); // fallback if the upgrade stalls
            } catch (_e) { startPolling(); }
        }

        // ---- Final results (R2 / club archive): rendered for finalized events ----
        function fmtBreakdown(raw) {
            let b = {}; try { b = JSON.parse(raw || '{}') || {}; } catch (_e) {}
            const parts = [];
            const add = (n, label) => { if (b[n]) parts.push(b[n] + ' ' + label + (b[n] > 1 ? 's' : '')); };
            add('aces', 'ace'); add('eagles', 'eagle'); add('birdies', 'birdie'); add('pars', 'par'); add('bogeys', 'bogey'); add('doubles_plus', 'dbl+');
            return parts.join(' · ');
        }
        async function renderFinalResults(eventId, container) {
            let results = [];
            try { const d = await fetchJson(`/events/${encodeURIComponent(eventId)}/results`); results = (d && d.results) || []; } catch (_e) {}
            container.replaceChildren();
            container.appendChild(el('h3', 'roster-title', 'Final results'));
            if (!results.length) { container.appendChild(el('p', 'lb-empty', 'Results not posted yet.')); return; }
            const table = el('table', 'lb-table');
            const thead = el('thead'); const htr = el('tr');
            ['Pos', 'Player', 'Total', 'To Par', 'Scoring'].forEach((h) => htr.appendChild(el('th', null, h)));
            thead.appendChild(htr); table.appendChild(thead);
            const tbody = el('tbody');
            results.forEach((r) => {
                const tr = el('tr');
                tr.appendChild(el('td', 'lb-pos', r.place != null ? String(r.place) : '—'));
                tr.appendChild(el('td', 'lb-name', r.name != null ? String(r.name) : 'Player'));
                tr.appendChild(el('td', null, r.total != null ? String(r.total) : '—'));
                const tp = el('td', 'lb-topar', r.to_par != null ? fmtToPar(r.to_par) : '—');
                if (r.to_par < 0) tp.classList.add('under'); else if (r.to_par > 0) tp.classList.add('over');
                tr.appendChild(tp);
                tr.appendChild(el('td', 'res-chips', fmtBreakdown(r.breakdown)));
                tbody.appendChild(tr);
            });
            table.appendChild(tbody); container.appendChild(table);
        }

        // ---- CTPs + ace pot (Track G G3, public on the event detail) ----
        async function renderEventExtras(eventId, card) {
            let ctps = [], pot = null;
            try { const d = await fetchJson(`/events/${encodeURIComponent(eventId)}/ctps`); ctps = (d && d.ctps) || []; } catch (_e) {}
            try { const d = await fetchJson(`/events/${encodeURIComponent(eventId)}/ace-pot`); pot = d && d.ace_pot; } catch (_e) {}
            if (ctps.length) {
                card.appendChild(el('h3', 'roster-title', 'CTPs (closest to pin)'));
                const ul = el('ul', 'extras-list');
                ctps.forEach((c) => ul.appendChild(el('li', null, 'Hole ' + c.hole + (c.division ? ' (' + c.division + ')' : '') + (c.prize ? ' — ' + c.prize : '') + (c.winner_name ? ' · 🏆 ' + c.winner_name : ''))));
                card.appendChild(ul);
            }
            if (pot && (pot.total_cents > 0 || (pot.status && pot.status !== 'active'))) {
                card.appendChild(el('h3', 'roster-title', 'Ace pot'));
                const money = (c) => '$' + ((c || 0) / 100).toLocaleString();
                let txt;
                if (pot.status === 'paid_out') txt = 'Paid out' + (pot.winner_name ? ' to ' + pot.winner_name + ' 🏆' : '');
                else if (pot.status === 'carried') txt = money(pot.total_cents) + ' carried to the next event';
                else txt = money(pot.total_cents) + ' in the pot' + (pot.contributors ? ' (' + pot.contributors + ' in)' : '');
                card.appendChild(el('p', 'detail-notes', txt));
            }
        }

        function renderDetail(rawEvent) {
            const ev = normalizeEvent(rawEvent);
            detailEl.replaceChildren();

            const backBtn = el('button', 'back-link', '← All events');
            backBtn.type = 'button';
            backBtn.addEventListener('click', () => { window.location.hash = ''; });
            detailEl.appendChild(backBtn);

            const card = el('div', 'detail-card');

            const head = el('div', 'detail-head');
            head.appendChild(el('h2', 'detail-title', ev.name));
            if (ev.type) head.appendChild(badge(typeLabel(ev.type), 'type-badge ' + ev.type));
            if (ev.status) head.appendChild(badge(statusLabel(ev.status), 'status-badge ' + ev.status));
            card.appendChild(head);

            // Live scoring: real-time leaderboard over WebSocket (polling fallback).
            if (ev.status === 'live') {
                const banner = el('div', 'live-banner');
                banner.appendChild(el('span', 'live-dot'));
                banner.appendChild(el('span', null, 'Live scoring in progress'));
                const conn = el('span', 'lb-conn', 'connecting…');
                banner.appendChild(conn);
                card.appendChild(banner);
                const lb = el('div', 'lb-wrap');
                card.appendChild(lb);
                mountLiveLeaderboard(ev.id, lb, conn);
            } else if (ev.status === 'final') {
                const rwrap = el('div', 'lb-wrap');
                card.appendChild(rwrap);
                renderFinalResults(ev.id, rwrap);
            }

            const facts = el('div', 'detail-facts');
            facts.appendChild(fact('Date', formatEventDate(ev.date)));
            if (ev.format) facts.appendChild(fact('Format', ev.format));

            const courseName = courseNameFor(courseIndex, ev.course_id);
            const course = courseIndex.get(String(ev.course_id));
            if (courseName) {
                const udiscLink = course && sanitizeUrl(course.udisc_url);
                if (udiscLink) {
                    const wrap = el('span');
                    wrap.appendChild(el('span', null, courseName + ' '));
                    wrap.appendChild(safeLink(course.udisc_url, '(UDisc ↗)'));
                    facts.appendChild(fact('Course', wrap));
                } else {
                    facts.appendChild(fact('Course', courseName));
                }
            }
            if (ev.external_url && sanitizeUrl(ev.external_url)) {
                facts.appendChild(fact('More info', safeLink(ev.external_url, 'External link ↗')));
            }
            card.appendChild(facts);

            if (ev.notes) {
                card.appendChild(el('div', 'detail-notes', ev.notes));
            }

            // Roster, grouped by division when present.
            const grouped = groupPlayersByDivision(ev.players);
            if (grouped.length) {
                card.appendChild(el('h3', 'roster-title', `Players (${ev.players.length})`));
                // If everyone is in the single synthetic 'Open' group, skip the heading.
                const showDivisionHeads = !(grouped.length === 1 && grouped[0].division === 'Open');
                for (const group of grouped) {
                    const groupWrap = el('div', 'division-group');
                    if (showDivisionHeads) groupWrap.appendChild(el('div', 'division-name', group.division));
                    const listEl = el('div', 'player-list');
                    for (const p of group.players) {
                        const row = el('div', 'player-row');
                        row.appendChild(el('span', 'player-name', p && p.name != null ? String(p.name) : 'Unnamed'));
                        if (p && p.pdga_no) row.appendChild(el('span', 'player-pdga', '#' + p.pdga_no));
                        if (p && p.team) row.appendChild(el('span', 'player-team', String(p.team)));
                        listEl.appendChild(row);
                    }
                    groupWrap.appendChild(listEl);
                    card.appendChild(groupWrap);
                }
            }

            renderEventExtras(ev.id, card); // CTPs + ace pot (Track G G3), filled in async

            detailEl.appendChild(card);
            setView('detail');
            lastUpdatedEl.hidden = true;
            window.scrollTo(0, 0);
        }

        async function loadDetail(id) {
            teardownLive(); // close any prior live socket before re-rendering
            showStatus('Loading event…', false);
            try {
                await ensureCourses(); // for course name + UDisc link
                const data = await fetchJson(`/events/${encodeURIComponent(id)}`);
                if (!data || !data.event) {
                    showStatus('That event could not be found.', true, () => { window.location.hash = ''; });
                    return;
                }
                renderDetail(data.event);
            } catch (_err) {
                showStatus('We couldn’t load that event right now. Please try again.', true, () => loadDetail(id));
            }
        }

        // ---------- ROUTING ----------
        // Hash route: "#event/:id" -> event detail; "#league/:id" -> league standings; else hub.
        function parseHash() {
            const h = window.location.hash || '';
            let m = h.match(/^#event\/(.+)$/); if (m) return { view: 'event', id: decodeURIComponent(m[1]) };
            m = h.match(/^#league\/(.+)$/); if (m) return { view: 'league', id: decodeURIComponent(m[1]) };
            return null;
        }

        function route() {
            stopRefresh();
            const r = parseHash();
            if (r && r.view === 'event') loadDetail(r.id);
            else if (r && r.view === 'league') loadLeague(r.id);
            else { loadHub(); startRefresh(); }
        }

        // Quiet ~60s background refresh while on the hub. Keeps current content
        // on screen and only swaps it in once the new payload parses cleanly.
        function startRefresh() {
            stopRefresh();
            refreshTimer = setInterval(async () => {
                if (!hubEl.hidden) {
                    try {
                        const data = await fetchJson('/events');
                        renderHub(data && data.events);
                    } catch (_e) {
                        // Silent on background refresh; visible content stays put.
                    }
                }
            }, REFRESH_MS);
        }
        function stopRefresh() {
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        }

        window.addEventListener('hashchange', route);
        route();
    </script>
    <script src="crotts.js" defer></script>
</body>
</html>
