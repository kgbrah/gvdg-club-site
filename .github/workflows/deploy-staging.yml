name: Deploy to staging (gvdgclub.com)

on:
  workflow_dispatch:

concurrency:
  group: staging-worker
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-worker/package-lock.json
      - name: Static site tests
        run: npm test
      - name: Install dependencies
        working-directory: auth-worker
        run: npm ci
      - name: Type-check + tests (gate the staging deploy)
        working-directory: auth-worker
        run: |
          npm run typegen:check
          npm run audit
          npm run typecheck
          npm test
          node scripts/validate-wrangler-config.mjs --env staging
          node scripts/validate-wrangler-config.mjs --env gvdgclub
      - name: Build static Pages artifact
        run: |
          rm -rf .pages-dist
          mkdir .pages-dist
          cp -R *.html *.js img _headers CNAME site.webmanifest .pages-dist/
      - name: Deploy static site to Cloudflare Pages
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.105.0
          command: pages deploy .pages-dist --project-name gvdg-club-site --branch main --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: fdf77c2a9f4966b946b4d232eb7889a3
      - name: Deploy Worker to the staging env
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: auth-worker
          environment: staging
          secrets: |
            GEMINI_API_KEY
          command: deploy --env staging
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Deploy Worker to the gvdgclub auth env
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: auth-worker
          environment: gvdgclub
          secrets: |
            GEMINI_API_KEY
          command: deploy --env gvdgclub
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Skip notice
        if: ${{ env.HAS_CF_TOKEN != 'true' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not configured; staging deploy skipped after tests."
