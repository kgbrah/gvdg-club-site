name: Verify scoring platform

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-platform-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test and build all app entry points
        run: |
          npm test
          npm run build
          node scripts/lint-hex.mjs
      - name: Check React
        run: npm run qa:react
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Verify navigation, scoring and member workflows
        run: |
          node scripts/qa/public-polish-browser-qa.mjs
          node scripts/qa/crotts-browser-qa.mjs
          node scripts/qa/navigation-browser-qa.mjs
          node scripts/qa/live-scoring-browser-qa.mjs
          node scripts/qa/scorer-polish-browser-qa.mjs
          node scripts/qa/scorer-weather-states-browser-qa.mjs
          node scripts/qa/spectator-browser-qa.mjs
          node scripts/qa/members-dashboard-browser-qa.mjs
          node scripts/qa/account-recovery-browser-qa.mjs
          node scripts/qa/screen-load-recovery-browser-qa.mjs
          node scripts/qa/practice-browser-qa.mjs
          node scripts/qa/shot-ledger-browser-qa.mjs
          node scripts/qa/phone-activity-browser-qa.mjs
          node scripts/qa/member-visual-polish-qa.mjs
          node scripts/qa/member-subpages-browser-qa.mjs
          node scripts/qa/member-archive-browser-qa.mjs
          node scripts/qa/admin-visual-polish-qa.mjs
          node scripts/qa/offline-round-browser-qa.mjs
          node scripts/qa/offline-service-worker-browser-qa.mjs
          node scripts/qa/pwa-update-browser-qa.mjs
          node scripts/qa/pwa-waiting-worker-browser-qa.mjs
          node scripts/qa/field-test-browser-qa.mjs
      - name: Install Worker dependencies (Lost & Found QA runs the real Worker in-process)
        run: npm ci --prefix auth-worker
      - name: Verify Lost & Found (redaction, matching, returns, karma) against the real Worker
        run: node scripts/qa/lost-found-browser-qa.mjs
      - name: Verify the email step and Forgot PIN end to end against the real Worker
        run: node scripts/qa/account-recovery-e2e-qa.mjs

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: auth-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-worker/package-lock.json
      - run: npm ci
      - name: Validate types, behavior and deployment bindings
        run: |
          npm run typegen:check
          npm run typecheck
          npm test
          node scripts/validate-wrangler-config.mjs --env staging
          node scripts/validate-wrangler-config.mjs --env gvdgclub
