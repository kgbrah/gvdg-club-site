<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Directory | Greenville Disc Golf Club</title>
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Club">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <style>


        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; }
        

        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(to bottom, rgba(244,244,249,0.25), rgba(244,244,249,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: cover;
        }

        [data-theme="dark"] body::before {
            background: linear-gradient(to bottom, rgba(15,15,30,0.25), rgba(15,15,30,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: cover;
        }

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
        }

        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { text-decoration: none; }
        .logo-image { height: 50px; width: auto; }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a.active { color: var(--primary); }

        .theme-toggle {
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: white;
            width: 40px; height: 40px; border-radius: 6px; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center; transition: border-color 0.15s ease;
        }
        .theme-toggle:hover { border-color: rgba(255, 255, 255, 0.6); }

        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links {
                position: fixed; top: 70px; left: 0; right: 0;
                background: rgba(26, 26, 46, 0.98); flex-direction: column; gap: 0; padding: 2rem;
                transform: translateY(-100%); opacity: 0; transition: all 0.3s ease; pointer-events: none;
            }
            .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links li { padding: 1rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        }

        /* Login Gate */
        .login-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6rem 2rem 2rem; }
        #membersReactAuthGate { width: min(100%, 400px); }
        .login-card { background: var(--bg-secondary); border-radius: 12px; padding: 2.5rem; max-width: 400px; width: 100%; box-shadow: 0 4px 24px var(--card-shadow); text-align: center; border: 1px solid var(--border-color); }
        .login-icon { font-size: 4rem; margin-bottom: 1.5rem; color: var(--primary); display: flex; justify-content: center; }
        .auth-icon-label { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
        .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--text-primary); margin-bottom: 0.5rem; letter-spacing: 0.02em; }
        .login-subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
        .login-form { display: flex; flex-direction: column; gap: 1rem; }
        .login-form[hidden] { display: none !important; }
        .form-group { text-align: left; }
        .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .form-input { width: 100%; padding: 0.875rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); font-size: 1rem; color: var(--text-primary); transition: border-color 0.15s ease; }
        .form-input:focus { outline: none; border-color: var(--secondary); }
        .form-input::placeholder { color: var(--text-muted); }
        .form-hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }

        .login-btn { background: var(--primary-strong); color: white; border: none; padding: 1rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: background 0.2s ease; margin-top: 1rem; }
        .login-btn:hover { background: #e55a2b; }

        .login-error { background: rgba(220, 53, 69, 0.1); color: #dc3545; padding: 1rem; border-radius: 10px; margin-top: 1rem; display: none; font-weight: 600; }
        .login-error.show { display: block; animation: shake 0.5s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        .back-link { display: inline-block; margin-top: 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease; }
        .back-link:hover { color: var(--primary); }

        .members-content { display: none; padding-top: 100px; }
        .members-content.active { display: block; }

        #members {
            background: var(--bg-secondary); border-radius: 12px; margin: 2rem auto;
            padding: clamp(1.5rem, 5vw, 3rem); max-width: calc(1200px - 4rem);
            border: 1px solid var(--border-color); box-shadow: 0 2px 12px var(--card-shadow);
            overflow-x: hidden;
        }

        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 6vw, 3rem); text-align: center; margin-bottom: 2rem; letter-spacing: 0.05em; color: var(--text-primary); }

        .welcome-banner {
            background: var(--green); color: white; padding: 1.25rem 1.5rem; border-radius: 8px;
            margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 1rem; border-left: 4px solid var(--primary);
        }
        .welcome-text { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.45rem; font-size: 1.1rem; }
        .welcome-text strong { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.02em; }

        .logout-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.25); padding: 0.5rem 1.25rem; border-radius: 6px; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: background 0.15s ease; }
        .logout-btn:hover { background: rgba(255,255,255,0.25); }

        .members-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; margin-bottom: 2.5rem; }
        @media (min-width: 768px) { .members-stats-grid { grid-template-columns: repeat(4, 1fr); } }

        .members-stat-card { background: var(--secondary); padding: 1.25rem 1rem; border-radius: 10px; text-align: center; color: white; transition: transform 0.15s ease; }
        .members-stat-card:nth-child(2) { background: var(--green); }
        .members-stat-card:nth-child(3) { background: var(--primary); }
        .members-stat-card:nth-child(4) { background: #5a4a78; }
        .members-stat-card:hover { transform: translateY(-2px); }
        .members-stat-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .members-stat-number { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1; margin-bottom: 0.25rem; }
        .members-stat-label { font-size: clamp(0.75rem, 2vw, 0.9rem); opacity: 0.95; text-transform: uppercase; letter-spacing: 0.05em; }

        .members-chart-container { background: var(--bg-primary); border-radius: 8px; padding: 1.25rem; margin-bottom: 2rem; border: 1px solid var(--border-color); }
        .members-chart-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 1rem; text-align: center; }
        .members-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 140px; gap: 3px; padding: 0 0.5rem; }
        .members-chart-bar { flex: 1; min-width: 0; background: var(--secondary); border-radius: 3px 3px 0 0; transition: opacity 0.15s ease; cursor: pointer; position: relative; }
        .members-chart-bar:hover { opacity: 0.85; }
        .members-chart-bar::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10; margin-bottom: 5px; }
        .members-chart-bar:hover::after { opacity: 1; }
        .members-chart-labels { display: flex; justify-content: space-between; margin-top: 0.75rem; padding: 0 0.5rem; }
        .members-chart-label { font-size: 0.65rem; color: var(--text-muted); text-align: center; flex: 1; }
        @media (max-width: 640px) { .members-chart-label:nth-child(odd) { visibility: hidden; } }

        /* Meeting Minutes */
        .meeting-minutes-container { background: var(--bg-primary); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid var(--border-color); }
        .meeting-minutes-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 1rem; text-align: center; }
        .meeting-minutes-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .meeting-minutes-item { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: box-shadow 0.15s ease; }
        .meeting-minutes-item:hover { box-shadow: 0 2px 8px var(--card-shadow-hover); }
        .meeting-minutes-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; cursor: pointer; gap: 1rem; }
        .meeting-minutes-info { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .meeting-minutes-date { font-weight: 700; color: var(--text-primary); font-size: 1rem; }
        .meeting-minutes-badge { background: var(--secondary); color: white; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
        .meeting-minutes-badge.new { background: var(--green); }
        .meeting-minutes-toggle { background: none; border: none; color: var(--text-muted); font-size: 1.25rem; cursor: pointer; transition: transform 0.2s ease; padding: 0.25rem; }
        .meeting-minutes-item.expanded .meeting-minutes-toggle { transform: rotate(180deg); }
        .meeting-minutes-content { display: none; padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--border-color); }
        .meeting-minutes-item.expanded .meeting-minutes-content { display: block; }
        .meeting-minutes-section { margin-top: 1rem; }
        .meeting-minutes-section-title { font-weight: 700; color: var(--secondary-text); font-size: 0.95rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .meeting-minutes-section ul { list-style: none; padding-left: 0; }
        .meeting-minutes-section li { position: relative; padding-left: 1.25rem; margin-bottom: 0.4rem; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }
        .meeting-minutes-section li::before { content: "•"; position: absolute; left: 0; color: var(--primary); font-weight: bold; }
        .meeting-minutes-action-items { background: rgba(255, 107, 53, 0.08); border-radius: 6px; padding: 1rem; margin-top: 1rem; }
        [data-theme="dark"] .meeting-minutes-action-items { background: rgba(255, 107, 53, 0.12); }
        .meeting-minutes-action-items .meeting-minutes-section-title { color: var(--primary); }
        .meeting-minutes-action-items ul { list-style: none; padding-left: 0; counter-reset: action-item; }
        .meeting-minutes-action-items li { position: relative; padding-left: 1.5rem; margin-bottom: 0.4rem; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }
        .meeting-minutes-action-items li::before { content: counter(action-item) "."; counter-increment: action-item; position: absolute; left: 0; color: var(--primary); font-weight: 600; }
        .meeting-minutes-download { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1rem; padding: 0.5rem 1rem; background: var(--secondary); color: white; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; transition: background 0.15s ease; }
        .meeting-minutes-download:hover { background: #003d6b; }

        /* Members Controls & Grid */
        .members-controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .members-search { flex: 1; min-width: 200px; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); font-size: 1rem; color: var(--text-primary); outline: none; transition: border-color 0.15s ease; }
        .members-search:focus { border-color: var(--secondary); }
        .members-filter-btn { padding: 0.75rem 1.25rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-secondary); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
        .members-filter-btn:hover { border-color: var(--secondary); color: var(--secondary-text); }
        .members-filter-btn.active { background: var(--secondary); border-color: var(--secondary); color: white; }
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
        @media (max-width: 640px) { .members-grid { grid-template-columns: 1fr; } }

        .member-card { background: var(--green); border-radius: 10px; padding: 1.25rem; color: white; transition: transform 0.15s ease; position: relative; overflow: hidden; }
        .member-card:hover { transform: translateY(-3px); }
        .member-card.founding { background: var(--secondary); border-left: 4px solid var(--primary); }
        .member-card.founding:hover { transform: translateY(-3px); }
        .member-card.special-badge::before { content: attr(data-badge); position: absolute; top: 12px; right: -32px; background: var(--accent); color: var(--dark); padding: 0.25rem 2.5rem; font-size: 0.6rem; font-weight: 700; transform: rotate(45deg); text-transform: uppercase; }
        .member-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; margin-bottom: 0.875rem; font-weight: 700; font-family: 'Bebas Neue', sans-serif; }
        .member-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; margin-bottom: 0.35rem; }
        .member-since { font-size: 0.85rem; opacity: 0.9; margin-bottom: 0.75rem; }
        .member-pdga { display: inline-block; background: rgba(255, 255, 255, 0.18); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .member-pdga a { color: white; text-decoration: none; }
        .member-pdga a:hover { text-decoration: underline; }
        .members-load-more { text-align: center; margin-top: 2rem; }
        .members-load-btn { background: var(--secondary); color: white; padding: 0.75rem 2rem; border-radius: 6px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: background 0.15s ease; }
        .members-load-btn:hover { background: #003d6d; }
        .members-count { text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem; }
        .members-no-results { text-align: center; padding: 3rem; color: var(--text-muted); grid-column: 1 / -1; }
        .members-no-results-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem; }
        footer a { color: var(--primary); text-decoration: none; }

        /* ==========================================
           DOUBLES LEAGUE SECTION
           ========================================== */
        .doubles-league-container {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 2.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            max-width: 100%;
            min-width: 0;
            width: 100%;
        }

        .doubles-league-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .doubles-tabs {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
            flex-wrap: wrap; justify-content: center;
        }

        .doubles-tab {
            padding: 0.6rem 1.1rem; border-radius: 6px;
            border: 1px solid var(--border-color); background: var(--bg-secondary);
            color: var(--text-secondary); font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
        }
        .doubles-tab:hover { border-color: var(--secondary); color: var(--secondary-text); }
        .doubles-tab.active { background: var(--secondary); border-color: var(--secondary); color: white; }

        .doubles-panel { display: none; min-width: 0; max-width: 100%; }
        .doubles-panel.active { display: block; }

        .champions-banner {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.75rem; margin-bottom: 1.5rem;
        }
        @media (max-width: 640px) { .champions-banner { grid-template-columns: 1fr; } }

        .champion-card {
            background: linear-gradient(135deg, var(--secondary) 0%, #003d6b 100%);
            border-radius: 8px; padding: 1rem 1.25rem; color: white;
            position: relative; overflow: hidden; transition: transform 0.15s ease;
        }
        .champion-card:hover { transform: translateY(-2px); }
        .champion-trophy { position: absolute; top: 0.65rem; right: 0.75rem; opacity: 0.35; }
        .champion-season { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; margin-bottom: 0.25rem; }
        .champion-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.02em; }
        .champion-points { font-size: 0.8rem; opacity: 0.9; margin-top: 0.15rem; }

        .doubles-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); max-width: 100%; min-width: 0; width: 100%; -webkit-overflow-scrolling: touch; }
        .doubles-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 700px; }
        .doubles-table thead th {
            background: var(--secondary); color: white; padding: 0.7rem 0.75rem;
            text-align: left; font-weight: 700; font-size: 0.78rem;
            text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
            cursor: pointer; user-select: none; position: relative;
        }
        .doubles-table thead th:hover { background: #003d6b; }
        .doubles-sort-btn { width: 100%; display: inline-flex; align-items: center; gap: 0.2rem; background: transparent; border: 0; color: inherit; font: inherit; text-align: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; }
        .doubles-table thead th .sort-arrow { margin-left: 0.25rem; font-size: 0.65rem; opacity: 0.5; }
        .doubles-table thead th.sorted .sort-arrow { opacity: 1; }
        .doubles-table tbody tr { border-bottom: 1px solid var(--border-color); transition: background 0.1s ease; }
        .doubles-table tbody tr:hover { background: rgba(0, 78, 137, 0.06); }
        [data-theme="dark"] .doubles-table tbody tr:hover { background: rgba(0, 78, 137, 0.15); }
        .doubles-table tbody td { padding: 0.65rem 0.75rem; color: var(--text-secondary); }
        .doubles-table tbody tr:nth-child(even) { background: var(--bg-tertiary); }
        .doubles-table tbody tr:nth-child(even):hover { background: rgba(0, 78, 137, 0.08); }
        [data-theme="dark"] .doubles-table tbody tr:nth-child(even):hover { background: rgba(0, 78, 137, 0.18); }
        .doubles-table .rank-cell { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--text-muted); text-align: center; width: 40px; }
        .doubles-table .rank-cell.gold { color: #D4A017; }
        .doubles-table .rank-cell.silver { color: #8A8A8A; }
        .doubles-table .rank-cell.bronze { color: #CD7F32; }
        .doubles-table .player-name-cell { font-weight: 700; color: var(--text-primary); white-space: nowrap; }
        .doubles-table .player-name-cell .trophy-icon { margin-left: 0.35rem; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.1rem; vertical-align: middle; }
        .doubles-table .highlight-cell { font-weight: 700; color: var(--secondary-text); }
        .doubles-table .win-badge { display: inline-block; background: var(--accent); color: var(--dark); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.7rem; font-weight: 700; }
        .doubles-table .top3-badge { display: inline-block; background: var(--green); color: white; padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.7rem; font-weight: 700; }

        .doubles-search-bar {
            width: 100%; max-width: 400px; padding: 0.65rem 1rem; border-radius: 6px;
            border: 1px solid var(--border-color); background: var(--bg-secondary);
            font-size: 0.9rem; color: var(--text-primary); outline: none;
            margin-bottom: 1rem; transition: border-color 0.15s ease;
        }
        .doubles-search-bar:focus { border-color: var(--secondary); }

        .doubles-load-more-wrap { text-align: center; margin-top: 1rem; }
        .doubles-load-btn { background: var(--secondary); color: white; padding: 0.6rem 1.75rem; border-radius: 6px; font-weight: 600; font-size: 0.88rem; border: none; cursor: pointer; transition: background 0.15s ease; }
        .doubles-load-btn:hover { background: #003d6d; }
        .doubles-showing-count { text-align: center; margin-top: 0.75rem; color: var(--text-muted); font-size: 0.85rem; }

    </div>

    <script>
    (function() {
        // Member auth backed by the Cloudflare Worker (auth-worker/). The endpoint is
        // read from #loginGate[data-auth-base] so it's configured in one place per deploy.
        const _gate = document.getElementById('loginGate');
        const LOCAL_AUTH_BASE = ['127.0.0.1', 'localhost'].includes(location.hostname)
            ? 'http://127.0.0.1:8788'
            : '';
        // Explicit data-auth-base wins; else resolve by host so one codebase serves prod, the
        // gvdgclub.com dev site, Cloudflare Pages previews, and localhost.
        const _h = location.hostname;
        const AUTH_BASE = (
            LOCAL_AUTH_BASE ||
            (_gate.dataset.authBase || '').trim() ||
            ((_h === 'greenvillediscgolf.com' || _h === 'www.greenvillediscgolf.com')
                ? 'https://auth.greenvillediscgolf.com' : 'https://auth.gvdgclub.com')
        ).replace(/\/+$/, '');
        const TOKEN_KEY = 'gvdg_member_token';
        const NAME_KEY = 'gvdg_member_name';
        const PDGA_KEY = 'gvdg_member_pdga';
        const $ = (id) => document.getElementById(id);
        let memberProfile = { pdgaNo: null, udisc: null, photo: null, isAdmin: false, sub: null, name: null };
        let pendingPhoto = null; // a chosen-but-unsaved uploaded photo (data URL)
        function memberDashboardContext() {
            return {
                pdgaNo: memberProfile.pdgaNo || sessionStorage.getItem(PDGA_KEY) || null,
                photo: memberProfile.photo || null,
                isAdmin: memberProfile.isAdmin === true,
                name: memberProfile.name || sessionStorage.getItem(NAME_KEY) || null,
                sub: memberProfile.sub || null,
            };
        }
        function publishMemberProfile() {
            const detail = memberDashboardContext();
            window.GVDG_MEMBER_DASHBOARD_CONTEXT = detail;
            window.dispatchEvent(new CustomEvent('gvdg:member-profile-updated', { detail }));
        }
        function applyProfile(data) {
            memberProfile = { pdgaNo: data.pdgaNo || null, udisc: data.udisc || null, photo: data.photo || null, isAdmin: data.isAdmin === true, sub: data.sub || memberProfile.sub || null, name: data.name || memberProfile.name || null };
            if (data.name) sessionStorage.setItem(NAME_KEY, data.name);
            if (data.pdgaNo) sessionStorage.setItem(PDGA_KEY, data.pdgaNo); else sessionStorage.removeItem(PDGA_KEY);
            publishMemberProfile();
        }

        function showError(el, msg) { if (!el) return; el.textContent = 'Error: ' + msg; el.classList.add('show'); }
        function clearError(el) { if (!el) return; el.textContent = ''; el.classList.remove('show'); }
        function setBusy(btn, busy) {
            if (!btn) return;
            if (!btn.dataset.label) btn.dataset.label = btn.textContent;
            btn.disabled = busy;
            btn.textContent = busy ? 'Please wait…' : btn.dataset.label;
        }

        let sessionExpiredShown = false;
        function setAuthMode(mode) {
            window.dispatchEvent(new CustomEvent('gvdg:member-auth-mode', { detail: { mode, passkeysSupported: passkeysSupported() } }));
        }
        function handleSessionExpired() {
            if (sessionExpiredShown) return;
            sessionExpiredShown = true;
            try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
            showLogin();
            const err = $('loginError'); if (err) showError(err, 'Your session expired — please sign in again.');
            setTimeout(() => { sessionExpiredShown = false; }, 4000);
        }
        function api(path, { method = 'GET', token, body } = {}) {
            const headers = {};
            if (body) headers['Content-Type'] = 'application/json';
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return fetch(AUTH_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined })
                .then((r) => {
                    // An authed request rejected with 401 means the token expired — bounce to a clean re-login.
                    if (r.status === 401 && token) handleSessionExpired();
                    return r;
                });
        }

        function showLogin() {
            $('loginGate').style.display = 'flex';
            $('membersContent').classList.remove('active');
            setAuthMode('login');
            clearError($('loginError'));
            clearError($('pinChangeError'));
            clearError($('profileError'));
            if (passkeysSupported()) startPasskeyPriming(); // keep a fresh challenge ready the whole time the login screen is up
        }
        function showPinChange() {
            $('loginGate').style.display = 'flex';
            $('membersContent').classList.remove('active');
            setAuthMode('pin');
            clearError($('pinChangeError'));
            requestAnimationFrame(() => $('newPinInput') && $('newPinInput').focus());
        }

        function showMembersContent(name) {
            stopPasskeyPriming(); // logged in — no need to keep priming a login challenge
            $('loginGate').style.display = 'none';
            $('membersContent').classList.add('active');
            const passkeyStatus = $('passkeyStatus');
            if (passkeyStatus) passkeyStatus.textContent = '';
            window.dispatchEvent(new CustomEvent('gvdg:member-dashboard-opened', {
                detail: { name: name || memberProfile.name || sessionStorage.getItem(NAME_KEY) || null },
            }));
        }

        function logout() {
            sessionStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(NAME_KEY);
            sessionStorage.removeItem(PDGA_KEY);
            window.GVDG_MEMBER_DASHBOARD_CONTEXT = null;
            window.dispatchEvent(new CustomEvent('gvdg:member-profile-updated', { detail: { pdgaNo: null, photo: null, isAdmin: false, name: null } }));
            const pinInput = $('pinInput');
            if (pinInput) pinInput.value = '';
            showLogin();
        }

        // ---- Passkeys / WebAuthn (opt-in) ----
        const passkeysSupported = () => typeof window.PublicKeyCredential !== 'undefined';

        function b64urlToBuf(s) {
            s = String(s).replace(/-/g, '+').replace(/_/g, '/');
            const pad = '='.repeat((4 - (s.length % 4)) % 4);
            const bin = atob(s + pad);
            const u = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
            return u.buffer;
        }
        function bufToB64url(buf) {
            const u = new Uint8Array(buf); let s = '';
            for (const b of u) s += String.fromCharCode(b);
            return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function enablePasskey() {
            const status = $('passkeyStatus'), btn = $('enablePasskeyBtn');
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!status || !btn || !token || !passkeysSupported()) return;
            status.textContent = ''; btn.disabled = true;
            try {
                const r = await api('/webauthn/register/options', { method: 'POST', token });
                if (!r.ok) throw new Error('options');
                const options = await r.json();
                options.challenge = b64urlToBuf(options.challenge);
                options.user.id = b64urlToBuf(options.user.id);
                if (options.excludeCredentials)
                    options.excludeCredentials = options.excludeCredentials.map((c) => ({ ...c, id: b64urlToBuf(c.id) }));
                const cred = await navigator.credentials.create({ publicKey: options });
                const body = {
                    id: cred.id, rawId: bufToB64url(cred.rawId), type: cred.type,
                    response: {
                        clientDataJSON: bufToB64url(cred.response.clientDataJSON),
                        attestationObject: bufToB64url(cred.response.attestationObject),
                        transports: cred.response.getTransports ? cred.response.getTransports() : [],
                    },
                    clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
                };
                const v = await api('/webauthn/register/verify', { method: 'POST', token, body });
                status.textContent = v.ok
                    ? '✓ Passkey added — use it to log in next time.'
                    : 'Could not add passkey. Please try again.';
            } catch (e) {
                status.textContent = e && e.name === 'NotAllowedError' ? 'Passkey setup cancelled.' : 'Could not add passkey.';
            } finally {
                btn.disabled = false;
            }
        }

        // Pre-fetch a passkey challenge as soon as the login screen appears. This warms the (possibly
        // cold) auth Worker AND puts a ready challenge in hand, so the click can call
        // navigator.credentials.get() with NO network request in between. Browsers — Safari/WebKit
        // especially — require fresh "user activation" for the passkey prompt; a slow cold-start fetch
        // between the click and get() consumes that window and rejects the FIRST attempt, which is
        // exactly why a quick second try (Worker now warm) succeeded. Server TTL is ~5 min; single-use.
        let passkeyPrefetch = null; // { options, flowId, ts }
        const PASSKEY_REFRESH_MS = 170000; // re-prime before the held challenge ages out (server TTL ~5 min)
        async function prefetchPasskey() {
            if (!AUTH_BASE || !passkeysSupported()) return;
            if (passkeyPrefetch && Date.now() - passkeyPrefetch.ts < PASSKEY_REFRESH_MS) return; // still fresh — keep it
            try {
                const r = await api('/webauthn/auth/options', { method: 'POST' });
                if (!r.ok) return;
                const { options, flowId } = await r.json();
                passkeyPrefetch = { options, flowId, ts: Date.now() };
            } catch (_e) { /* best-effort warm-up; the click path will fetch on demand */ }
        }
        // Keep a fresh challenge ALWAYS in hand while the login screen is up, so the tap never has to fetch
        // one first (an await before navigator.credentials.get(), which Safari rejects as not user-activated).
        // Re-prime periodically AND whenever the tab is refocused (background timers get throttled).
        let passkeyPrimeTimer = null, passkeyVisHooked = false;
        function startPasskeyPriming() {
            prefetchPasskey();
            if (!passkeyPrimeTimer) passkeyPrimeTimer = setInterval(prefetchPasskey, PASSKEY_REFRESH_MS);
            if (!passkeyVisHooked) {
                passkeyVisHooked = true;
                document.addEventListener('visibilitychange', () => { if (!document.hidden && $('loginGate').style.display !== 'none') prefetchPasskey(); });
            }
        }
        function stopPasskeyPriming() { if (passkeyPrimeTimer) { clearInterval(passkeyPrimeTimer); passkeyPrimeTimer = null; } }
        async function loginWithPasskey() {
            const errEl = $('loginError'); clearError(errEl);
            if (!AUTH_BASE) { showError(errEl, 'Login is not configured yet — contact an admin.'); return; }
            if (!passkeysSupported()) { showError(errEl, 'Passkeys are not supported on this device.'); return; }
            const btn = $('passkeyBtn'); setBusy(btn, true);
            try {
                // Use the pre-fetched challenge if it's fresh (< 4 min; server TTL is 5) so there is NO
                // network round-trip between this click and navigator.credentials.get() — that's what
                // preserves user activation and fixes the first-attempt failure. Otherwise fetch now
                // (the Worker was already warmed by the page-load prefetch, so this stays fast).
                let options, flowId;
                const pf = passkeyPrefetch;
                passkeyPrefetch = null; // single use
                if (pf && (Date.now() - pf.ts) < 290000) {
                    options = pf.options; flowId = pf.flowId;
                } else {
                    const r = await api('/webauthn/auth/options', { method: 'POST' });
                    if (!r.ok) throw new Error('options');
                    const j = await r.json(); options = j.options; flowId = j.flowId;
                }
                options.challenge = b64urlToBuf(options.challenge);
                if (options.allowCredentials)
                    options.allowCredentials = options.allowCredentials.map((c) => ({ ...c, id: b64urlToBuf(c.id) }));
                const a = await navigator.credentials.get({ publicKey: options });
                const body = {
                    flowId,
                    response: {
                        id: a.id, rawId: bufToB64url(a.rawId), type: a.type,
                        response: {
                            clientDataJSON: bufToB64url(a.response.clientDataJSON),
                            authenticatorData: bufToB64url(a.response.authenticatorData),
                            signature: bufToB64url(a.response.signature),
                            userHandle: a.response.userHandle ? bufToB64url(a.response.userHandle) : undefined,
                        },
                        clientExtensionResults: a.getClientExtensionResults ? a.getClientExtensionResults() : {},
                    },
                };
                const v = await api('/webauthn/auth/verify', { method: 'POST', body });
                if (v.status === 200) {
                    const data = await v.json();
                    sessionStorage.setItem(TOKEN_KEY, data.token);
                    applyProfile(data);
                    if (data.mustChangePin) showPinChange();
                    else showMembersContent(data.name);
                } else {
                    showError(errEl, 'Passkey sign-in failed. Use your PIN instead.');
                }
            } catch (e) {
                showError(errEl, e && e.name === 'NotAllowedError' ? 'Passkey sign-in cancelled.' : 'Passkey sign-in failed. Use your PIN instead.');
            } finally {
                setBusy(btn, false);
                prefetchPasskey(); // prime the next attempt and keep the Worker warm
            }
        }

        async function handleLogin() {
            const identifier = $('identifierInput').value.trim();
            const pin = $('pinInput').value.trim();
            const errEl = $('loginError');
            clearError(errEl);
            if (!AUTH_BASE) { showError(errEl, 'Login is not configured yet — contact an admin.'); return; }
            if (!identifier || !pin) { showError(errEl, 'Enter your PDGA #/UDisc and PIN.'); return; }
            const btn = $('loginBtn');
            setBusy(btn, true);
            try {
                const res = await api('/login', { method: 'POST', body: { identifier, pin } });
                if (res.status === 200) {
                    const data = await res.json();
                    sessionStorage.setItem(TOKEN_KEY, data.token);
                    applyProfile(data);
                    $('pinInput').value = '';
                    if (data.mustChangePin) showPinChange();
                    else showMembersContent(data.name);
                } else if (res.status === 423) {
                    const data = await res.json().catch(() => ({}));
                    const mins = Math.ceil((data.retryAfterSec || 900) / 60);
                    showError(errEl, 'Too many attempts. Try again in ~' + mins + ' min.');
                } else if (res.status === 401) {
                    showError(errEl, 'Invalid PDGA #/UDisc or PIN.');
                } else {
                    showError(errEl, 'Something went wrong. Please try again.');
                }
            } catch (e) {
                showError(errEl, 'Network error. Please check your connection.');
            } finally {
                setBusy(btn, false);
            }
        }

        async function handleSetPin() {
            const newPin = $('newPinInput').value.trim();
            const confirmPin = $('confirmPinInput').value.trim();
            const errEl = $('pinChangeError');
            clearError(errEl);
            if (!/^\d{4}$/.test(newPin)) { showError(errEl, 'PIN must be exactly 4 digits.'); return; }
            if (newPin !== confirmPin) { showError(errEl, 'PINs do not match.'); return; }
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) { showLogin(); return; }
            const btn = $('setPinBtn');
            setBusy(btn, true);
            try {
                const res = await api('/set-pin', { method: 'POST', token, body: { newPin } });
                if (res.status === 200) {
                    const data = await res.json();
                    sessionStorage.setItem(TOKEN_KEY, data.token);
                    $('newPinInput').value = ''; $('confirmPinInput').value = '';
                    showProfileSetup(); // first-login: offer to complete profile before entering
                } else if (res.status === 401) {
                    showLogin();
                } else {
                    showError(errEl, 'Could not update PIN. Please try again.');
                }
            } catch (e) {
                showError(errEl, 'Network error. Please try again.');
            } finally {
                setBusy(btn, false);
            }
        }

        async function checkSession() {
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token || !AUTH_BASE) { showLogin(); return; }
            try {
                const res = await api('/me', { token });
                if (res.status === 200) {
                    const data = await res.json();
                    applyProfile(data);
                    if (data.mustChangePin) showPinChange();
                    else showMembersContent(data.name || sessionStorage.getItem(NAME_KEY));
                } else {
                    logout();
                }
            } catch (e) {
                showLogin();
            }
        }

        // ---- Complete-your-profile (PDGA #, UDisc, photo) ----
        function showProfileSetup() {
            $('loginGate').style.display = 'flex';
            $('membersContent').classList.remove('active');
            setAuthMode('profile');
            clearError($('profileError'));
            $('profilePdgaInput').value = memberProfile.pdgaNo || '';
            $('profileUdiscInput').value = memberProfile.udisc || '';
            pendingPhoto = null;
            const prev = $('profilePhotoPreview');
            if (memberProfile.photo) { prev.src = memberProfile.photo; prev.style.display = 'block'; }
            else { prev.removeAttribute('src'); prev.style.display = 'none'; }
        }

        function resizeImageFile(file, maxPx) {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
                    const w = Math.max(1, Math.round(img.width * scale));
                    const h = Math.max(1, Math.round(img.height * scale));
                    const c = document.createElement('canvas'); c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(c.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
                img.src = url;
            });
        }

        async function onPhotoChosen(e) {
            const file = (e.target && e.target.files && e.target.files[0]) || (e.detail && e.detail.files && e.detail.files[0]);
            if (!file) return;
            const dataUrl = await resizeImageFile(file, 256);
            if (!dataUrl || dataUrl.length > 190000) { showError($('profileError'), 'That image is too large — please pick a smaller one.'); return; }
            clearError($('profileError'));
            pendingPhoto = dataUrl;
            const prev = $('profilePhotoPreview'); prev.src = dataUrl; prev.style.display = 'block';
        }

        async function saveProfile() {
            const errEl = $('profileError'); clearError(errEl);
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) { showLogin(); return; }
            const pdga = $('profilePdgaInput').value.trim();
            const udisc = $('profileUdiscInput').value.trim();
            if (pdga && !/^\d+$/.test(pdga)) { showError(errEl, 'PDGA # must be digits only.'); return; }
            const body = { pdgaNo: pdga, udisc: udisc };
            if (pendingPhoto) body.photo = pendingPhoto;
            const btn = $('profileSaveBtn'); setBusy(btn, true);
            try {
                const r = await api('/profile', { method: 'POST', token, body });
                if (r.status === 200) {
                    applyProfile(await r.json());
                    pendingPhoto = null;
                    showMembersContent(sessionStorage.getItem(NAME_KEY));
                } else if (r.status === 409) {
                    const d = await r.json().catch(() => ({}));
                    showError(errEl, (d.field === 'udisc' ? 'That UDisc username' : 'That PDGA #') + ' is already linked to another member.');
                } else {
                    showError(errEl, 'Could not save your profile. Please check the values and try again.');
                }
            } catch (e) {
                showError(errEl, 'Network error. Please try again.');
            } finally {
                setBusy(btn, false);
            }
        }

        window.addEventListener('gvdg:member-login-requested', handleLogin);
        window.addEventListener('gvdg:member-pin-change-requested', handleSetPin);
        window.addEventListener('gvdg:member-profile-save-requested', saveProfile);
        window.addEventListener('gvdg:member-profile-skip-requested', () => showMembersContent(sessionStorage.getItem(NAME_KEY)));
        window.addEventListener('gvdg:member-profile-photo-chosen', onPhotoChosen);
        window.addEventListener('gvdg:member-passkey-login-requested', loginWithPasskey);
        window.addEventListener('gvdg:member-add-passkey-requested', enablePasskey);
        window.addEventListener('gvdg:member-edit-profile-requested', showProfileSetup);
        window.addEventListener('gvdg:member-logout-requested', logout);

        document.querySelector('.menu-toggle').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
        });

        const themeToggle = document.querySelector('.theme-toggle');
        const themeIcon = document.querySelector('.theme-icon');
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.textContent = '☀️';
        }
        themeToggle.addEventListener('click', function() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeIcon.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });

        window.addEventListener('gvdg:member-auth-ready', checkSession, { once: true });

    })();
    </script>
    <script type="module" src="members-app/members-app.js"></script>
    <script src="crotts.js" defer></script>
</body>
</html>
