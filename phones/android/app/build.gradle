plugins {
    id 'com.android.application' version '8.9.2'
}

def production = providers.gradleProperty('activityProduction').getOrElse('false') == 'true'
def site = production ? 'greenvillediscgolf.com' : 'gvdgclub.com'

android {
    namespace 'com.gvdgclub.activity'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gvdgclub.activity'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'API_BASE', '"https://auth.' + site + '"'
        buildConfigField 'String', 'PAIR_SITE', '"https://' + site + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
