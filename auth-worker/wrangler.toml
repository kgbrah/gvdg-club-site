# GVDG member auth Worker.
# mostlysober252: replace the KV `id` values with real namespace IDs
# (`wrangler kv namespace create ROSTER` / `... RATELIMIT`) and set the JWT secret
# with `wrangler secret put JWT_SECRET` before deploying.

name = "gvdg-member-auth"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[[kv_namespaces]]
binding = "ROSTER"
id = "REPLACE_WITH_ROSTER_KV_ID"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "REPLACE_WITH_RATELIMIT_KV_ID"

# Club operations data (events, leagues, courses, layouts, results, meetings, fundraisers).
# mostlysober252: `wrangler d1 create gvdg`, paste the database_id, then apply migrations with
# `wrangler d1 migrations apply DB` (remote) — add `--local` for dev.
[[d1_databases]]
binding = "DB"
database_name = "gvdg"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Workers AI powers the "Crotts" assistant (POST /assistant). No id needed — just the binding.
# mostlysober252: this binding is free to declare; usage bills to the account's Workers AI quota.
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://www.greenvillediscgolf.com,https://greenvillediscgolf.com"
SESSION_TTL_SEC = "900"
# Workers AI model for the Crotts assistant (override if desired).
ASSISTANT_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# Passkeys / WebAuthn. RP_ID must be the registrable domain (covers the www subdomain);
# EXPECTED_ORIGIN must exactly match the page origin the browser reports.
RP_ID = "greenvillediscgolf.com"
RP_NAME = "Greenville Disc Golf Club"
EXPECTED_ORIGIN = "https://www.greenvillediscgolf.com"
# JWT_SECRET is set as a secret, NOT here:  wrangler secret put JWT_SECRET
